<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adam Asmaca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adam Asmaca">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1530" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../theme.css">
<style>
/* sayfaya özel: darağacı, kelime kutuları, klavye */
.gallows{display:flex; gap:16px; align-items:center}
.gallows svg{width:124px; height:144px; flex:none; color:var(--ink); filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.gallows svg *{stroke:currentColor; stroke-width:3.2; stroke-linecap:round; fill:none}
.gallows svg .part{display:none; stroke-dasharray:120; stroke-dashoffset:120}
.gallows svg .part.on{display:block; animation:draw .6s var(--ease) forwards}
.gallows svg .part.old{animation:none; stroke-dashoffset:0}
.gallows svg .rope{stroke:var(--margin)}
.gallows svg .sway{transform-origin:80px 10px; animation:sway 3.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.misses{font-variant-numeric:tabular-nums}
.lives{display:flex; gap:5px}
.lives i{width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent); transition:background .3s,transform .3s var(--spring)}
.lives i.off{background:var(--line-2); box-shadow:none; transform:scale(.7)}
.word{display:flex; flex-wrap:wrap; gap:8px 6px; justify-content:center; padding:8px 0; perspective:500px}
.slot{width:32px; height:44px; border-bottom:3px solid var(--line-2); font:700 1.8rem/44px var(--display); text-align:center; transition:border-color .3s}
.slot.gap{border:none; width:14px}
.slot.on{color:var(--accent); border-color:var(--accent); animation:reveal .55s var(--spring) both}
.slot.miss{color:var(--bad); border-color:var(--bad)}
@keyframes reveal{0%{transform:rotateX(90deg); opacity:0}100%{transform:none; opacity:1}}
.keys{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
.key{min-height:46px; border-radius:var(--r-s); border:1.5px solid var(--line-2); background:var(--card-solid); color:var(--ink); font-weight:800; font-size:1.05rem; transition:transform .12s var(--spring),background .2s,opacity .2s}
.key:not(:disabled):active{transform:scale(.88)}
.key:disabled{opacity:.3}
.key.hit{background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:var(--gold-ink); border-color:transparent; opacity:1}
.key.miss{background:transparent; color:var(--bad); text-decoration:line-through; opacity:.6}
.secret{font:700 1.5rem/1.2 var(--display); letter-spacing:.14em}
.banner{display:flex; justify-content:center; gap:10px; align-items:center}
.tcount{min-width:2.2em; padding:2px 8px; border-radius:99px; background:rgba(0,0,0,.12); font-variant-numeric:tabular-nums}
.tcount.low{background:var(--bad); color:#fff; animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.winner{font-size:2.6rem; background:linear-gradient(135deg,var(--gold),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop-in .7s var(--spring) both}
.trophy{font-size:3rem; line-height:1; animation:float 3s ease-in-out infinite}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../fx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
"use strict";
/* ---------- sabitler ve yardımcılar ---------- */
const ALPHA=[..."ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ"];
const LEVELS=[["basit","Basit"],["orta","Orta"],["zor","Zor"],["pro","Pro"]];
/* turn: harf başına saniye (0 = süresiz). Süre dolarsa bir can gider ve sıra geçer. wordCost: yanlış kelime tahmininin can bedeli. */
const LEVEL={basit:{miss:8,len:[3,6],turn:0,wordCost:1},orta:{miss:6,len:[3,24],turn:0,wordCost:1},zor:{miss:4,len:[7,24],turn:15,wordCost:2},pro:{miss:3,len:[8,24],turn:8,wordCost:2}};
const lvl=st=>LEVEL[st&&st.level]||LEVEL.orta;
function fixSettings(st){st=Object.assign({level:"orta"},st);if(![5,10,15,20,30].includes(st.rounds))st.rounds=10;return st}
const maxMiss=()=>S?S.maxMiss||6:6;
const WORDS=[
 ["KEDİ","Hayvan"],["ZÜRAFA","Hayvan"],["PENGUEN","Hayvan"],["KAPLUMBAĞA","Hayvan"],["SİNCAP","Hayvan"],["YUNUS","Hayvan"],["FLAMİNGO","Hayvan"],["KİRPİ","Hayvan"],["BAYKUŞ","Hayvan"],["TİMSAH","Hayvan"],
 ["GİRNE","Şehir"],["GAZİMAĞUSA","Şehir"],["LEFKOŞA","Şehir"],["İSKELE","Şehir"],["GÜZELYURT","Şehir"],["İSTANBUL","Şehir"],["ANTALYA","Şehir"],["TRABZON","Şehir"],["ESKİŞEHİR","Şehir"],["ÇANAKKALE","Şehir"],
 ["KARPUZ","Meyve"],["ÇİLEK","Meyve"],["PORTAKAL","Meyve"],["MUZ","Meyve"],["ŞEFTALİ","Meyve"],["KİRAZ","Meyve"],["ANANAS","Meyve"],["İNCİR","Meyve"],["ERİK","Meyve"],["GREYFURT","Meyve"],
 ["FOTOĞRAFÇI","Meslek"],["ÖĞRETMEN","Meslek"],["MİMAR","Meslek"],["AŞÇI","Meslek"],["KUAFÖR","Meslek"],["PİLOT","Meslek"],["ECZACI","Meslek"],["MARANGOZ","Meslek"],["GAZETECİ","Meslek"],["HEMŞİRE","Meslek"],
 ["ŞEMSİYE","Eşya"],["BUZDOLABI","Eşya"],["KULAKLIK","Eşya"],["ÇEKİÇ","Eşya"],["YASTIK","Eşya"],["GÖZLÜK","Eşya"],["ANAHTAR","Eşya"],["BİSİKLET","Eşya"],["SAKSI","Eşya"],["DÜRBÜN","Eşya"],
 ["JAPONYA","Ülke"],["BREZİLYA","Ülke"],["MISIR","Ülke"],["KANADA","Ülke"],["ALMANYA","Ülke"],["HİNDİSTAN","Ülke"],["İSPANYA","Ülke"],["NORVEÇ","Ülke"],["MEKSİKA","Ülke"],["YUNANİSTAN","Ülke"],
 ["BAKLAVA","Yemek"],["MANTI","Yemek"],["LAHMACUN","Yemek"],["HELLİM","Yemek"],["KÖFTE","Yemek"],["MOLEHİYA","Yemek"],["PİLAVUNA","Yemek"],["ŞEFTALİ KEBABI","Yemek"],["MERCİMEK","Yemek"],["KÜNEFE","Yemek"],
 ["FUTBOL","Spor"],["BASKETBOL","Spor"],["YÜZME","Spor"],["DART","Spor"],["TENİS","Spor"],["VOLEYBOL","Spor"],["OKÇULUK","Spor"],["ESKRİM","Spor"],["BOKS","Spor"],["KAYAK","Spor"],
 ["GİTAR","Müzik aleti"],["BAĞLAMA","Müzik aleti"],["PİYANO","Müzik aleti"],["KEMAN","Müzik aleti"],["DAVUL","Müzik aleti"],["KLARNET","Müzik aleti"],["FLÜT","Müzik aleti"],["AKORDEON","Müzik aleti"],
 ["GÖKKUŞAĞI","Doğa"],["ŞİMŞEK","Doğa"],["VOLKAN","Doğa"],["ŞELALE","Doğa"],["ÇÖL","Doğa"],["OKYANUS","Doğa"],["BUZUL","Doğa"],["KASIRGA","Doğa"],
 ["ORANGUTAN","Hayvan"],["GERGEDAN","Hayvan"],["SU AYGIRI","Hayvan"],["KELEBEK","Hayvan"],["DENİZANASI","Hayvan"],["BUKALEMUN","Hayvan"],["KANGURU","Hayvan"],["AHTAPOT","Hayvan"],
 ["AVUSTRALYA","Ülke"],["ARJANTİN","Ülke"],["ENDONEZYA","Ülke"],["PORTEKİZ","Ülke"],["GÜNEY AFRİKA","Ülke"],["KAZAKİSTAN","Ülke"],["İSVİÇRE","Ülke"],["DANİMARKA","Ülke"],
 ["MUHASEBECİ","Meslek"],["VETERİNER","Meslek"],["ELEKTRİKÇİ","Meslek"],["TESİSATÇI","Meslek"],["İTFAİYECİ","Meslek"],["ARKEOLOG","Meslek"],["DİŞ HEKİMİ","Meslek"],["PSİKOLOG","Meslek"],
 ["ÇAMAŞIR MAKİNESİ","Eşya"],["TELEVİZYON","Eşya"],["ELEKTRİK SÜPÜRGESİ","Eşya"],["MİKRODALGA","Eşya"],["TERMOMETRE","Eşya"],["HESAP MAKİNESİ","Eşya"],
 ["KARNABAHAR","Bitki"],["PATLICAN","Bitki"],["AYÇİÇEĞİ","Bitki"],["ORKİDE","Bitki"],["LAVANTA","Bitki"],["OKALİPTÜS","Bitki"],
 ["HÜNKAR BEĞENDİ","Yemek"],["İMAM BAYILDI","Yemek"],["KARNIYARIK","Yemek"],["İÇLİ KÖFTE","Yemek"],["ZEYTİNYAĞLI SARMA","Yemek"],["TAVUK GÖĞSÜ","Yemek"],
 ["MİKROSKOP","Bilim"],["TELESKOP","Bilim"],["YERÇEKİMİ","Bilim"],["FOTOSENTEZ","Bilim"],["ELEKTRON","Bilim"],["GALAKSİ","Bilim"],["KROMOZOM","Bilim"],["ATMOSFER","Bilim"]
];
const QS=new URLSearchParams(location.search);
const NS="asm"+(QS.get("p")?"-"+QS.get("p"):"")+"-";
const ls={
  get(k,d){try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(NS+k)}catch(e){}}
};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const up=s=>String(s||"").trim().toLocaleUpperCase("tr").replace(/\s+/g," ");
const rid=n=>{let s="";const a="ABCDEFGHJKLMNPRSTUVYZ23456789";for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
let myId=ls.get("pid")||(localStorage.getItem((QS.get("p")?"ish-"+QS.get("p")+"-":"ish-")+"pid")||"").replace(/"/g,"");
if(!myId){myId="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}ls.set("pid",myId);
const validWord=w=>/^[A-ZÇĞİÖŞÜ]+( [A-ZÇĞİÖŞÜ]+)*$/.test(w)&&w.replace(/ /g,"").length>=3&&w.length<=24;

/* ---------- durum ---------- */
let G=null, S=null;
let isHost=false, mq=null, roomCode="", myName="", mySecret="";
let net="idle", everConnected=false, session=0, homeError="", formError="";
let lastHeard=0, lastHello=0, lastPing=0, hostUpSince=0, seen=new Map();

const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const topic=(code,k)=>"asmaca/v1/"+code+"/"+k;
const brokerOf=code=>BROKERS[(+code[4]||1)-1]||BROKERS[0];
const dec=p=>typeof p==="string"?p:new TextDecoder().decode(p);
function mqConnect(url){return mqtt.connect(url,{clientId:"asm_"+rid(12),clean:true,keepalive:10,reconnectPeriod:2000,connectTimeout:8000})}
function pubMsg(k,m,qos){ if(mq&&mq.connected&&roomCode){try{mq.publish(topic(roomCode,k),JSON.stringify(m),{qos:qos||0})}catch(e){}} }

/* ---------- oda sahibi: oyun kuralları ---------- */
function pub(){
  const g=G,s={code:g.code,phase:g.phase,players:g.players,hostId:g.hostId,settings:g.settings,v:g.v||0,maxMiss:lvl(g.settings).miss,turnSecs:lvl(g.settings).turn,turnLeft:g.phase==="play"&&g.turnDeadline?Math.max(0,g.turnDeadline-Date.now()):0,
    round:g.round,setter:g.setter,hint:g.hint,masked:g.masked,guessed:g.guessed,misses:g.misses,turn:g.turn,result:g.result,lastWrong:g.lastWrong||null,timeout:g.timeout||null};
  if(g.phase==="reveal"||g.phase==="final")s.word=g.word;
  return s;
}
function sync(){
  G.v=(G.v||0)+1;
  ls.set("host",Object.assign({},G,{saved:Date.now()}));
  pubMsg("st",{t:"state",s:pub()},1);
  apply(pub());
}
const online=()=>G.players.filter(p=>p.online);
const guessers=()=>online().filter(p=>p.id!==G.setter);
function armTurn(){const t=lvl(G.settings).turn; G.turnDeadline=t?Date.now()+t*1000:0}
function nextTurn(from){
  const gs=guessers(); if(!gs.length){G.turn=null;return}
  const i=gs.findIndex(p=>p.id===from);
  G.turn=gs[(i+1)%gs.length].id; armTurn();
}
function loseLife(n,from){ G.misses+=n; if(G.misses>=lvl(G.settings).miss){G.misses=lvl(G.settings).miss;finishRound(null);return true} nextTurn(from); return false }
function setWord(word,hint){
  G.word=word; G.hint=(hint||"").slice(0,30);
  G.masked=[...word].map(c=>c===" "?" ":null); G.guessed=[]; G.misses=0; G.result=null; G.lastWrong=null; G.timeout=null; G.phase="play";
  const gs=guessers(); G.turn=gs.length?gs[Math.floor(Math.random()*gs.length)].id:null; armTurn();
  sync();
}
function beginRound(){
  G.round++; G.result=null; G.word=""; G.masked=[]; G.guessed=[]; G.misses=0; G.turn=null;
  if(G.settings.mode==="pc"||online().length<2){
    G.setter="pc"; const L=lvl(G.settings);
    let pool=WORDS.filter(w=>{const n=w[0].replace(/ /g,"").length;return n>=L.len[0]&&n<=L.len[1]}); if(!pool.length)pool=WORDS;
    const w=pool[Math.floor(Math.random()*pool.length)]; setWord(w[0],w[1]);
  }else{
    const ps=online(); G.setter=ps[(G.round-1)%ps.length].id; G.phase="set"; sync();
  }
}
function finishRound(solver){
  G.result={solver:solver||null,hanged:!solver};
  const setter=G.players.find(p=>p.id===G.setter);
  if(solver){const p=G.players.find(x=>x.id===solver); if(p)p.score+=30+10*G.masked.filter(c=>c===null).length}
  else if(setter)setter.score+=40;
  G.masked=[...G.word]; G.phase="reveal"; sync();
}
function hostHandle(m,pid){
  if(!G)return;
  if(m.t==="join"){
    const name=String(m.name||"Oyuncu").slice(0,20);
    let p=G.players.find(x=>x.id===pid);
    if(p){p.name=name;p.online=true}else G.players.push({id:pid,name,score:0,online:true});
    sync();
  }else if(m.t==="leave"){
    const p=G.players.find(x=>x.id===pid); if(p){p.online=false; if(G.phase==="lobby")G.players=G.players.filter(x=>x.id!==pid); fixTurn(); sync()}
  }else if(m.t==="word"){
    if(G.phase==="set"&&pid===G.setter){const w=up(m.word); if(validWord(w))setWord(w,m.hint)}
  }else if(m.t==="g"){
    if(G.phase!=="play"||pid!==G.turn)return;
    const l=up(m.l); if(!ALPHA.includes(l)||G.guessed.includes(l))return;
    G.guessed.push(l); G.timeout=null; G.lastWrong=null;
    const p=G.players.find(x=>x.id===pid); let n=0;
    [...G.word].forEach((c,i)=>{if(c===l){G.masked[i]=l;n++}});
    if(n){ if(p)p.score+=10*n; if(!G.masked.includes(null)){finishRound(pid);return} armTurn() }
    else if(loseLife(1,pid))return;
    sync();
  }else if(m.t==="w"){
    if(G.phase!=="play"||pid!==G.turn)return;
    if(up(m.w)===G.word){finishRound(pid);return}
    G.lastWrong={pid,w:up(m.w).slice(0,24)};
    if(loseLife(lvl(G.settings).wordCost,pid))return;
    sync();
  }
}
function fixTurn(){
  if(!G||G.phase!=="play")return;
  const gs=guessers();
  if(!gs.length)return;
  if(!gs.some(p=>p.id===G.turn))G.turn=gs[0].id;
}
function newGame(){
  for(const p of G.players)p.score=0;
  G.players=G.players.filter(p=>p.online||p.id===G.hostId);
  G.round=0;G.phase="lobby";G.word="";G.masked=[];G.result=null;sync();
}

/* ---------- bağlantı ---------- */
function openHost(resume,idx){
  const my=++session; isHost=true; net="connecting"; render();
  if(!resume){
    idx=idx||0;
    if(idx>=BROKERS.length){leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");return}
    G.code=G.code.slice(0,4)+(idx+1);
  }
  roomCode=G.code;
  const c=mq=mqConnect(brokerOf(G.code));
  const giveUp=setTimeout(()=>{
    if(my!==session||everConnected)return;
    try{c.end(true)}catch(e){}
    if(resume)leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");else openHost(false,idx+1);
  },8000);
  c.on("connect",()=>{
    if(my!==session)return; clearTimeout(giveUp); everConnected=true; net="ok"; hostUpSince=Date.now();
    c.subscribe(topic(G.code,"in"),{qos:1},()=>{if(my===session)sync()});
  });
  c.on("close",()=>{if(my!==session||!everConnected)return; net="re"; render()});
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session||!G)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m||typeof m.pid!=="string"||m.pid===myId)return;
    const pid=m.pid.slice(0,40); seen.set(pid,Date.now());
    const pl=G.players.find(x=>x.id===pid), back=pl&&!pl.online&&m.t!=="leave"&&m.t!=="join";
    if(back)pl.online=true;
    hostHandle(m,pid);
    if(back)sync();
  });
}
function createRoom(name){
  G={code:rid(4)+"1",phase:"lobby",hostId:myId,players:[{id:myId,name,score:0,online:true}],
     settings:fixSettings(ls.get("settings",{rounds:10,mode:"sira"})),round:0,setter:null,word:"",hint:"",masked:[],guessed:[],misses:0,turn:null,result:null,v:0};
  everConnected=false; openHost(false,0);
}
function hello(){lastHello=Date.now(); pubMsg("in",{t:"join",pid:myId,name:myName},1)}
function joinRoom(code,name){
  const my=++session; isHost=false; net="connecting"; roomCode=code; myName=name; everConnected=false; render();
  ls.set("last",{code,name});
  const c=mq=mqConnect(brokerOf(code));
  let upc=false;
  setTimeout(()=>{
    if(my!==session||S)return;
    leave(upc?"Oda bulunamadı. Kodu kontrol et; oda sahibinin oyun ekranı açık olmalı.":"Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");
  },12000);
  c.on("connect",()=>{
    if(my!==session)return; upc=true;
    c.subscribe(topic(code,"st"),{qos:1},()=>{if(my===session)hello()});
  });
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m)return;
    if(m.t==="closed"){leave("Oda sahibi odayı kapattı.");return}
    lastHeard=Date.now();
    if(m.t==="ping"){ if(S)pubMsg("in",{t:"pong",pid:myId}); return }
    if(m.t==="state"&&m.s&&Array.isArray(m.s.players)){
      if(!m.s.players.some(x=>x.id===myId)){ if(Date.now()-lastHello>2500)hello(); return }
      if(S&&m.s.v<S.v&&S.v-m.s.v<20)return;
      everConnected=true; apply(m.s);
    }
  });
}
function leave(msg){
  session++;
  const c=mq;
  if(c){try{
    if(c.connected&&roomCode){
      if(isHost){ if(!msg)c.publish(topic(roomCode,"st"),JSON.stringify({t:"closed"})) }
      else if(S)c.publish(topic(roomCode,"in"),JSON.stringify({t:"leave",pid:myId}));
    }
    c.end();
  }catch(e){}}
  mq=null; roomCode="";
  if(isHost&&!msg)ls.del("host");
  G=null;S=null;isHost=false;net="idle";everConnected=false;menuOpen=false;homeError=msg||"";mySecret="";
  if(location.search.includes("oda=")){try{history.replaceState(null,"",location.pathname+(QS.get("p")?"?p="+QS.get("p"):""))}catch(e){}}
  render();
}
function send(m){
  if(isHost)hostHandle(m,myId);
  else pubMsg("in",Object.assign({pid:myId},m),1);
}
let turnDeadlineLocal=0;
function apply(s){
  const prevKey=S&&S.code+"#"+S.round;
  S=s; turnDeadlineLocal=s.turnSecs&&s.phase==="play"?Date.now()+(s.turnLeft||0):0;
  if(prevKey!==s.code+"#"+s.round){mySecret="";formError=""}
  render();
}

/* ---------- arayüz ---------- */
const app=document.getElementById("app");
let lastHTML="";
const nameOf=id=>id==="pc"?"Bilgisayar":((S.players.find(x=>x.id===id)||{}).name||"Biri");
const joinLink=()=>location.origin+location.pathname+"?oda="+S.code;
const codeOk=c=>/^[A-Z0-9]{4}[1-3]$/.test(c||"");

function viewHome(){
  const last=ls.get("last",{}), saved=ls.get("host",null), urlCode=(QS.get("oda")||"").toUpperCase();
  const canResume=saved&&saved.hostId===myId&&codeOk(saved.code)&&Date.now()-saved.saved<3*3600e3;
  return `
  <header><h1>Adam Asmaca</h1><p class="sub">Biri kelimeyi tutar, diğerleri sırayla harf söyler. Altı yanlışta adam asılır.</p></header>
  ${homeError?`<p class="err" role="alert">${esc(homeError)}</p>`:""}
  ${typeof mqtt==="undefined"?`<p class="err" role="alert">Bağlantı kütüphanesi yüklenemedi. İnterneti kontrol edip sayfayı yenile.</p>`:""}
  <section class="card sheet">
    <div class="field"><label for="name">Adın</label><input type="text" id="name" maxlength="20" autocomplete="nickname" value="${esc(ls.get("name",last.name||""))}" placeholder="Örn. Burak"></div>
    ${urlCode?"":`<button class="btn" data-act="create">Oda aç</button>`}
    ${canResume&&!urlCode?`<button class="btn ghost" data-act="resume">Açık odana dön (${esc(saved.code)})</button>`:""}
  </section>
  <section class="card">
    <div class="field"><label for="code">Oda kodu</label><input type="text" id="code" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(urlCode||"")}" placeholder="5 karakterli kod" style="letter-spacing:.2em;text-transform:uppercase"></div>
    <button class="btn ${urlCode?"":"ghost"}" data-act="join">Odaya katıl</button>
  </section>
  <p class="sub center"><a href="../">Tüm oyunlar</a> · <a href="../isim-sehir-hayvan/">İsim Şehir Hayvan</a></p>`;
}
let menuOpen=false;
function roomMenu(){
  if(!menuOpen)return "";
  return `<div class="scrim" data-act="menu-close"><div class="menu" role="dialog" aria-label="Oda menüsü" data-stop>
    <div class="grip"></div>
    <p class="sub center">Arkadaşların bu kodla katılsın</p>
    <div class="bigcode">${esc(S.code)}</div>
    ${qrSvg()}
    <div class="actions">
      <button class="btn gold" data-act="share">Katılma linkini paylaş</button>
      <button class="btn ghost" data-act="copycode">Kodu kopyala</button>
      <p class="sub center" id="sharemsg" hidden></p>
      <button class="btn ghost danger" data-act="leave">${isHost?"Odayı kapat":"Odadan çık"}</button>
      <button class="btn ghost" data-act="menu-close">Kapat</button>
    </div>
  </div></div>`;
}
function topBar(){
  return `<div class="top"><button class="pill btn-pill" data-act="menu" aria-haspopup="dialog" aria-expanded="${menuOpen}"><span class="dot ${net==="ok"?"":"off"}"></span>${net==="ok"?"Oda":"Bağlanıyor"} <span class="code">${esc(S.code)}</span> ▾</button>
  <span class="right"><span class="pill">${S.players.filter(p=>p.online).length} oyuncu</span>
<button class="icon-btn" data-act="mute" aria-pressed="${window.FX&&FX.muted}" aria-label="${window.FX&&FX.muted?"Sesi aç":"Sesi kapat"}" title="Ses">${window.FX&&FX.muted?"🔇":"🔊"}</button></span></div>${roomMenu()}
  ${net!=="ok"?`<div class="banner" role="status">${isHost||!mq||!mq.connected?"Bağlantı koptu, yeniden bağlanılıyor…":"Oda sahibine ulaşılamıyor. Onun oyun ekranı açık olmalı."}</div>`:""}`;
}
function playerList(){
  return `<ul class="players">${S.players.map(p=>`<li class="${p.online?"":"off"} ${S.phase==="play"&&p.id===S.turn?"turn":""}">${esc(p.name)}${p.id===S.hostId?" ★":""}${p.id===myId?" (sen)":""}${p.id===S.setter&&S.phase!=="lobby"?" ✎":""}</li>`).join("")}</ul>`;
}
function qrSvg(){
  try{ if(typeof qrcode!=="function")return ""; const q=qrcode(0,"M"); q.addData(joinLink()); q.make();
    return `<div class="qr" aria-label="Katılma QR kodu">${q.createSvgTag({cellSize:4,margin:0,scalable:true})}</div>`}catch(e){return ""}
}
function viewLobby(){
  const st=S.settings;
  const settings=isHost?`
    <section class="card">
      <h2>Kelimeyi kim tutsun?</h2>
      <div class="seg">
        <button data-act="mode" data-mode="sira" aria-pressed="${st.mode==="sira"}">Sırayla oyuncular</button>
        <button data-act="mode" data-mode="pc" aria-pressed="${st.mode==="pc"}">Bilgisayar seçsin</button>
      </div>
      <p class="sub">${st.mode==="pc"?"Herkes tahmin eder, kelimeler listeden gelir. Tek başına da oynanır.":"Her turda bir oyuncu kelime yazar, diğerleri tahmin eder."}</p>
      <h2>Zorluk</h2>
      <div class="seg">${LEVELS.map(([k,t])=>`<button data-act="level" data-level="${k}" aria-pressed="${(st.level||"orta")===k}">${t}</button>`).join("")}</div>
      <p class="sub">${({basit:"8 can, kısa kelimeler, süre yok.",orta:"6 can, süre yok.",zor:"4 can, 7+ harf, harf başına 15 saniye. Yanlış kelime 2 can.",pro:"3 can, 8+ harf, harf başına 8 saniye. Yanlış kelime 2 can. Yorulmaya hazır ol."})[st.level||"orta"]}</p>
      <div class="field"><label for="rounds">Tur sayısı</label><select id="rounds">${[5,10,15,20,30].map(v=>`<option value="${v}" ${v===st.rounds?"selected":""}>${v} tur</option>`).join("")}</select></div>
    </section>
    <button class="btn" data-act="start">Oyunu başlat</button>`
  :`<section class="card"><h2>Oyun ayarları</h2><p>${st.mode==="pc"?"Kelimeleri bilgisayar seçer":"Kelimeyi sırayla oyuncular tutar"} · ${st.rounds} tur · ${(LEVELS.find(l=>l[0]===(st.level||"orta"))||LEVELS[1])[1]}</p></section>
    <p class="sub center">Oda sahibinin oyunu başlatması bekleniyor…</p>`;
  return topBar()+`
  <section class="card sheet"><div class="top"><h2>Oyuncular (${S.players.length})</h2><button class="btn ghost small" data-act="menu">Davet et</button></div>${playerList()}
    <p class="sub">Kod, QR ve katılma linki üstteki oda kodunun altındaki menüde.</p></section>
  ${settings}`;
}
let shownMiss=0, shownGuessed=0, prevTurn=null;
function gallows(n){
  const mm=maxMiss(), steps=Math.max(0,Math.min(6,Math.round(n/mm*6)));   // can sayısı değişse de 6 parçalı çizim
  const cls=i=>"part "+(steps>i?(shownMiss>i?"on old":"on"):"");
  const parts=[
    `<circle class="${cls(0)}" cx="80" cy="42" r="11"/>`,
    `<line class="${cls(1)}" x1="80" y1="53" x2="80" y2="92"/>`,
    `<line class="${cls(2)}" x1="80" y1="62" x2="62" y2="80"/>`,
    `<line class="${cls(3)}" x1="80" y1="62" x2="98" y2="80"/>`,
    `<line class="${cls(4)}" x1="80" y1="92" x2="66" y2="118"/>`,
    `<line class="${cls(5)}" x1="80" y1="92" x2="94" y2="118"/>`];
  return `<svg viewBox="0 0 120 140" aria-hidden="true">
    <line x1="10" y1="134" x2="70" y2="134"/><line x1="30" y1="134" x2="30" y2="10"/><line x1="30" y1="10" x2="80" y2="10"/><line x1="30" y1="30" x2="50" y2="10"/>
    <g class="${steps>0&&!(S.result&&S.result.hanged)?"sway":""}"><line class="rope" x1="80" y1="10" x2="80" y2="31"/>${parts.join("")}</g></svg>`;
}
const lives=()=>`<div class="lives" aria-label="Kalan can">${Array.from({length:maxMiss()},(_,i)=>`<i class="${i<maxMiss()-S.misses?"":"off"}"></i>`).join("")}</div>`;
let known=[];
function wordRow(){
  return `<div class="word" aria-label="Kelime">${S.masked.map((c,i)=>c===" "?`<span class="slot gap"></span>`:`<span class="slot ${c?"on":""} ${S.result&&S.result.hanged&&c&&!S.guessed.includes(c)?"miss":""}" ${c&&known[i]?'style="animation:none"':""}>${c?esc(c):""}</span>`).join("")}</div>`;
}
function viewSet(){
  const mine=S.setter===myId;
  return topBar()+`
  <section class="card sheet"><p class="sub">Tur ${S.round} / ${S.settings.rounds}</p>
    <h2>${mine?"Kelimeyi sen tutuyorsun":esc(nameOf(S.setter))+" kelime yazıyor…"}</h2>
    ${mine?`
    <div class="field"><label for="word">Kelime</label><input type="text" id="word" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Sadece harf, en az 3"></div>
    <div class="field"><label for="hint">Kategori / ipucu (isteğe bağlı)</label><input type="text" id="hint" maxlength="30" autocomplete="off" placeholder="Örn. Hayvan"></div>
    ${formError?`<p class="err">${esc(formError)}</p>`:""}
    <button class="btn" data-act="word">Kelimeyi gönder</button>
    <p class="sub">Ekranını kimseye gösterme. Kelime asılırsa 40 puan senin.</p>`
    :`<p class="sub">Kelime gelince tahmin sırası başlar.</p>`}
  </section>
  <section class="card"><h2>Oyuncular</h2>${playerList()}</section>`;
}
function viewPlay(){
  const myTurn=S.turn===myId, setter=S.setter===myId, lw=S.lastWrong;
  return topBar()+`
  <section class="card sheet">
    <div class="gallows">${gallows(S.misses)}
      <div class="grow"><p class="sub">Tur ${S.round} / ${S.settings.rounds}</p>
        <h2>${setter?"Senin kelimen":"Kelimeyi "+esc(nameOf(S.setter))+" tuttu"}</h2>
        ${S.hint?`<p>${S.setter==="pc"?"Kategori":"İpucu"}: <b>${esc(S.hint)}</b></p>`:`<p class="sub">İpucu yok</p>`}
        ${lives()}<p class="misses sub">Kalan can: ${maxMiss()-S.misses}</p></div>
    </div>
    ${wordRow()}
    ${setter&&mySecret?`<p class="center sub">Kelime: <span class="secret">${esc(mySecret)}</span></p>`:""}
    <div class="banner" role="status"><span>${setter?"Tahminleri izliyorsun":myTurn?"Sıra sende, bir harf seç":S.turn?"Sıra "+esc(nameOf(S.turn))+"'de":"Tahmin edecek kimse yok"}</span>${S.turnSecs?` <span class="tcount" id="tcount"></span>`:""}</div>
    ${S.timeout?`<p class="sub center">${esc(nameOf(S.timeout.pid))} süreyi kaçırdı, bir can gitti.</p>`:""}
  </section>
  ${setter?"":`<section class="card">
    <div class="keys">${ALPHA.map(l=>{const g=S.guessed.includes(l),hit=g&&S.masked.includes(l);return `<button class="key ${g?(hit?"hit":"miss"):""}" data-act="g" data-l="${l}" ${g||!myTurn?"disabled":""}>${l}</button>`}).join("")}</div>
    <div class="row"><div class="grow"><input type="text" id="wguess" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Kelimenin tamamını yaz" ${myTurn?"":"disabled"}></div><button class="btn gold small" data-act="w" ${myTurn?"":"disabled"}>Tahmin et</button></div>
    <p class="sub">${lw?esc(nameOf(lw.pid))+" \""+esc(lw.w)+"\" dedi, tutmadı. ":""}Yanlış kelime tahmini ${lvl(S.settings).wordCost} can götürür ve sıra geçer.</p>
  </section>`}
  <section class="card"><h2>Oyuncular</h2>${playerList()}</section>`;
}
function viewReveal(){
  const r=S.result||{}, board=S.players.slice().sort((a,b)=>b.score-a.score), final=S.round>=S.settings.rounds;
  return topBar()+`
  <section class="card sheet">
    <div class="gallows">${gallows(S.misses)}
      <div class="grow"><p class="sub">Tur ${S.round} / ${S.settings.rounds}</p>
        <h2>${r.hanged?"Adam asıldı!":esc(nameOf(r.solver))+" bildi!"}</h2>
        <p class="sub">${r.hanged?(S.setter==="pc"?"Kimse bilemedi.":esc(nameOf(S.setter))+" 40 puan aldı."):"Kelime çözüldü."}</p></div>
    </div>
    ${wordRow()}
    ${S.hint?`<p class="center sub">${S.setter==="pc"?"Kategori":"İpucu"}: ${esc(S.hint)}</p>`:""}
  </section>
  <section class="card"><h2>Puan durumu</h2>
    <table class="rank"><tbody>${board.map((p,i)=>`<tr style="--i:${i}" class="${p.id===myId?"me":""}"><td>${i+1}</td><td>${esc(p.name)}</td><td class="pts">${p.score}</td></tr>`).join("")}</tbody></table>
  </section>
  ${isHost?`<button class="btn" data-act="next">${final?"Sonuçları göster":"Sonraki tur"}</button>`:`<p class="sub center">Oda sahibi devam ettirecek…</p>`}`;
}
function viewFinal(){
  const board=S.players.slice().sort((a,b)=>b.score-a.score), top=board[0];
  return topBar()+`
  <section class="card sheet center"><div class="trophy" aria-hidden="true">🏆</div><p class="sub">Oyun bitti</p><h1 class="winner">${top?esc(top.name):""}</h1><p class="sub">${top?top.score:0} puanla kazandı</p></section>
  <section class="card"><h2>Sıralama</h2>
    <table class="rank"><tbody>${board.map((p,i)=>`<tr style="--i:${i}" class="${p.id===myId?"me":""}"><td>${i+1}</td><td>${esc(p.name)}</td><td class="pts">${p.score}</td></tr>`).join("")}</tbody></table>
  </section>
  ${isHost?`<button class="btn" data-act="again">Yeni oyun</button>`:`<p class="sub center">Oda sahibi yeni oyun başlatabilir.</p>`}`;
}
function render(){
  let html;
  if(!S){
    html=net==="connecting"||net==="re"
      ?`<header><h1>Adam Asmaca</h1></header><section class="card center"><p>Odaya bağlanılıyor…</p><button class="btn ghost" data-act="leave">Vazgeç</button></section>`
      :viewHome();
  }else if(S.phase==="lobby")html=viewLobby();
  else if(S.phase==="set")html=viewSet();
  else if(S.phase==="play")html=viewPlay();
  else if(S.phase==="reveal")html=viewReveal();
  else html=viewFinal();
  if(html!==lastHTML){
    const act=document.activeElement, keep=act&&act.id?{id:act.id,v:act.value,s:act.selectionStart}:null;
    const vals={};for(const el of app.querySelectorAll("input[type=text]"))if(el.id)vals[el.id]=el.value;
    const screen=S?S.phase+"#"+S.round:"home", samePhase=app.dataset.screen===screen;
    app.classList.toggle("still",samePhase); app.innerHTML=html; lastHTML=html; app.dataset.screen=screen;
    if(samePhase)for(const id in vals){const el=document.getElementById(id);if(el)el.value=vals[id]}
    if(keep){const el=document.getElementById(keep.id);if(el&&!el.disabled){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
    if(!samePhase)window.scrollTo(0,0);
    if(S&&window.FX){
      if(S.phase==="play"&&samePhase){
        if(S.misses>shownMiss){FX.shake(document.querySelector(".gallows"));snd("bad")}
        else if((S.guessed||[]).length>shownGuessed)snd("good");
        if(S.turn===myId&&prevTurn!==myId)snd("turn");
      }
      if(S.phase==="play"&&!samePhase){snd("start"); if(S.turn===myId)setTimeout(()=>snd("turn"),400)}
      if(S.phase==="reveal"&&!samePhase){ if(S.result&&!S.result.hanged){FX.confetti();snd("win")} else snd("lose") }
      if(S.phase==="final"&&!samePhase){FX.confetti();snd("win")}
    }
    if(S){shownGuessed=S.phase==="play"?(S.guessed||[]).length:0; prevTurn=S.phase==="play"?S.turn:null}
    if(S){shownMiss=S.phase==="play"||S.phase==="reveal"?S.misses:0; known=(S.masked||[]).map(c=>!!c)}
  }
}
let lastTickSec=-1;
function tick(){
  const now=Date.now();
  const tc=document.getElementById("tcount");
  if(tc&&S&&S.phase==="play"&&turnDeadlineLocal){
    const left=Math.max(0,Math.ceil((turnDeadlineLocal-now)/1000)); const txt=left+" sn";
    if(tc.textContent!==txt){tc.textContent=txt; if(S.turn===myId&&left<=5&&left>0&&left!==lastTickSec){lastTickSec=left;snd("tick")}}
    tc.classList.toggle("low",left<=5);
  }
  if(isHost&&G&&mq&&mq.connected&&now-lastPing>4000){
    lastPing=now; let changed=false;
    pubMsg("st",{t:"ping"});
    if(now-hostUpSince>16000)for(const p of G.players){
      if(p.id!==myId&&p.online&&now-(seen.get(p.id)||0)>15000){p.online=false;changed=true}
    }
    if(changed){const t=G.turn;fixTurn();sync()}
  }
  if(isHost&&G&&G.phase==="play"&&G.turnDeadline&&now>=G.turnDeadline&&G.turn){
    const from=G.turn; G.lastWrong=null; G.timeout={pid:from}; if(!loseLife(1,from))sync();
  }
  if(!isHost&&mq){
    if(!S){ if(mq.connected&&now-lastHello>3000)hello() }
    else{
      const n=mq.connected&&now-lastHeard<13000?"ok":"re";
      if(n==="re"&&mq.connected&&now-lastHello>3000)hello();
      if(n!==net){net=n;render()}
    }
  }
}
setInterval(tick,250);

/* ---------- olaylar ---------- */
function readName(){
  const el=document.getElementById("name"), n=(el?el.value:"").trim().slice(0,20);
  if(!n){homeError="Önce adını yaz.";render();const e=document.getElementById("name");e&&e.focus();return null}
  ls.set("name",n);homeError="";return n;
}
function setSettings(){ls.set("settings",G.settings);sync()}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="create"){const n=readName();if(n)createRoom(n)}
  else if(a==="join"){
    const n=readName();if(!n)return;
    const code=(document.getElementById("code").value||"").trim().toLocaleUpperCase("en").replace(/[^A-Z0-9]/g,"");
    if(!codeOk(code)){homeError="Oda kodu 5 karakter olmalı, örneğin KTRZ1.";render();return}
    joinRoom(code,n);
  }
  else if(a==="resume"){
    const saved=ls.get("host",null);if(!saved||!codeOk(saved.code))return;
    G=saved;delete G.saved;G.settings=fixSettings(G.settings);G.players.forEach(p=>p.online=p.id===myId);seen=new Map();everConnected=false;openHost(true);
  }
  else if(a==="leave"){menuOpen=false;leave("")}
  else if(a==="menu"){menuOpen=true;render()}
  else if(a==="mute"){if(window.FX){FX.setMuted(!FX.muted);if(!FX.muted)FX.sound("tap")}lastHTML="";render()}
  else if(a==="menu-close"){if(ev.target.closest("[data-stop]")&&!ev.target.closest('[data-act="menu-close"].btn'))return;menuOpen=false;render()}
  else if(a==="copycode"){
    const msg=document.getElementById("sharemsg"),done=t=>{if(msg){msg.textContent=t;msg.hidden=false}};
    if(navigator.clipboard)navigator.clipboard.writeText(S.code).then(()=>done("Kod kopyalandı."),()=>done(S.code));else done(S.code);
  }
  else if(a==="share"){
    const url=joinLink(),msg=document.getElementById("sharemsg");
    const done=t=>{if(msg){msg.textContent=t;msg.hidden=false}};
    if(navigator.share)navigator.share({title:"Adam Asmaca",text:"Odaya katıl: "+S.code,url}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>done("Link kopyalandı."),()=>done(url));
    else done(url);
  }
  else if(a==="word"){
    const w=up(document.getElementById("word").value), he=document.getElementById("hint"), h=he?(he.value||"").trim():"";
    if(!validWord(w)){formError="Kelime sadece harflerden oluşmalı, en az 3 harf.";render();return}
    mySecret=w; formError=""; send({t:"word",word:w,hint:h}); render();
  }
  else if(a==="g"){send({t:"g",l:b.dataset.l})}
  else if(a==="w"){const el=document.getElementById("wguess"),w=up(el.value);if(!w)return;el.value="";send({t:"w",w})}
  else if(!isHost||!G)return;
  else if(a==="mode"){G.settings.mode=b.dataset.mode;setSettings()}
  else if(a==="level"){G.settings.level=b.dataset.level;setSettings()}
  else if(a==="start"){for(const p of G.players)p.score=0;G.round=0;beginRound()}
  else if(a==="next"){if(G.phase==="reveal"){if(G.round>=G.settings.rounds){G.phase="final";sync()}else beginRound()}}
  else if(a==="again")newGame();
});
document.addEventListener("change",ev=>{
  if(!isHost||!G)return;
  if(ev.target.id==="rounds"){G.settings.rounds=+ev.target.value;setSettings()}
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter")return;const el=ev.target;
  const click=sel=>{ev.preventDefault();const b=document.querySelector(sel);b&&b.click()};
  if(el.id==="code")click('[data-act="join"]');
  else if(el.id==="word"){ev.preventDefault();const h=document.getElementById("hint");if(h)h.focus();else click('[data-act="word"]')}
  else if(el.id==="hint")click('[data-act="word"]');
  else if(el.id==="wguess")click('[data-act="w"]');
});
let wake=null;
async function keepAwake(){try{if(S&&"wakeLock" in navigator&&document.visibilityState==="visible"&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{keepAwake();if(document.visibilityState==="visible")tick()});
document.addEventListener("click",keepAwake);
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(b&&!b.disabled&&window.FX&&!b.classList.contains("key")&&b.dataset.act!=="mute")FX.sound("tap")});
const snd=n=>{if(window.FX)FX.sound(n)};

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("../sw.js").catch(()=>{});
render();
</script>
</body>
</html>
