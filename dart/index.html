<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pro Dart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pro Dart">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1530" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../theme.css">
<style>
/* sayfaya özel: 3D sahne, skor şeridi, atış alanı */
.stage{position:relative; border-radius:var(--r); overflow:hidden; background:#0c0e1c; box-shadow:var(--shadow); touch-action:none; -webkit-user-select:none; user-select:none}
.stage canvas{display:block; width:100%; height:auto}
.hud{position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; gap:8px; padding:10px 12px; pointer-events:none; color:#fff7e6}
.hud .who{font:800 .95rem/1.2 var(--body); text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hud .need{font:600 .8rem/1.2 var(--body); opacity:.85}
.hud .darts{display:flex; gap:6px}
.hud .darts i{width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold)}
.hud .darts i.used{background:rgba(255,255,255,.25); box-shadow:none}
.hint{position:absolute; left:0; right:0; bottom:10px; text-align:center; color:rgba(255,247,230,.85); font:700 .85rem/1.2 var(--body); pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.6); animation:float 2.6s ease-in-out infinite}
.toast{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); padding:10px 18px; border-radius:99px; background:rgba(0,0,0,.55); color:#fff; font:800 1.6rem/1 var(--display); pointer-events:none; animation:toast 1.1s var(--ease) both; white-space:nowrap}
.toast.big{font-size:2.4rem; background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:var(--gold-ink)}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0; transform:translate(-50%,-70%) scale(1)}}
.scores{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px}
.score{padding:10px 12px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--card-solid); display:flex; flex-direction:column; gap:2px; min-width:0}
.score.turn{border-color:transparent; background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:var(--gold-ink); box-shadow:var(--glow)}
.score .n{font:800 .8rem/1.2 var(--body); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.score .v{font:600 2rem/1 var(--display); font-variant-numeric:tabular-nums}
.score .avg{font-size:.72rem; opacity:.75}
.visits{display:flex; gap:6px; flex-wrap:wrap}
.visit{padding:4px 9px; border-radius:99px; border:1px solid var(--line); font-size:.82rem; font-weight:700; font-variant-numeric:tabular-nums}
.visit.bust{color:var(--bad); text-decoration:line-through}
.legend{display:flex; gap:12px; flex-wrap:wrap; color:var(--soft); font-size:.85rem}
.winner{font-size:2.6rem; background:linear-gradient(135deg,var(--gold),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop-in .7s var(--spring) both}
.trophy{font-size:3rem; line-height:1; animation:float 3s ease-in-out infinite}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../fx.js"></script>
<script>
"use strict";
/* ---------- sabitler ---------- */
const SEGS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];      // saat yönünde, 20 üstte
const R={bull:6.35,outer:15.9,tIn:99,tOut:107,dIn:162,dOut:170,board:225};  // mm, standart tahta
const THROW_Z=2370;                                                   // mm, atış çizgisi–tahta
const LEVELS=[["basit","Basit"],["orta","Orta"],["zor","Zor"],["pro","Pro"]];
/* sigma: bilgisayarın saçılması (mm). human: oyuncunun atışına eklenen temel saçılma. dblOut/dblIn: çift ile bitirme/başlama. */
const LEVEL={basit:{sigma:55,human:4,dblOut:false,dblIn:false},orta:{sigma:32,human:7,dblOut:false,dblIn:false},zor:{sigma:17,human:10,dblOut:true,dblIn:false},pro:{sigma:9,human:13,dblOut:true,dblIn:true}};
const QS=new URLSearchParams(location.search);
const NS="drt"+(QS.get("p")?"-"+QS.get("p"):"")+"-";
const ls={
  get(k,d){try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(NS+k)}catch(e){}}
};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=n=>{let s="";const a="ABCDEFGHJKLMNPRSTUVYZ23456789";for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
let myId=ls.get("pid");
if(!myId){myId="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);ls.set("pid",myId)}
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const lvl=st=>LEVEL[st&&st.level]||LEVEL.orta;
const snd=n=>{if(window.FX)FX.sound(n)};

/* ---------- puanlama (saf) ---------- */
function hit(x,y){   // mm, tahta merkezi (0,0), y yukarı
  const r=Math.hypot(x,y);
  if(r<=R.bull)return{v:50,m:2,label:"Bull",seg:25};
  if(r<=R.outer)return{v:25,m:1,label:"25",seg:25};
  if(r>R.dOut)return{v:0,m:0,label:"Dışarı",seg:0};
  let a=Math.atan2(x,y);                     // 0 = yukarı, saat yönü
  let i=Math.round(a/(Math.PI/10)); i=((i%20)+20)%20;
  const s=SEGS[i];
  if(r>=R.dIn)return{v:s*2,m:2,label:"D"+s,seg:s};
  if(r>=R.tIn&&r<=R.tOut)return{v:s*3,m:3,label:"T"+s,seg:s};
  return{v:s,m:1,label:String(s),seg:s};
}
function segCenter(seg,m){  // hedef noktası (mm)
  if(seg===25)return m===2?{x:0,y:0}:{x:0,y:11};
  const i=SEGS.indexOf(seg), a=i*(Math.PI/10);
  const r=m===3?103:m===2?166:135;
  return{x:Math.sin(a)*r,y:Math.cos(a)*r};
}
/* bilgisayarın hedef seçimi: 501 standart stratejisi, basit çıkış tablosu */
function pcTarget(score,L){
  if(L.dblOut){
    if(score===50)return segCenter(25,2);
    if(score<=40&&score%2===0)return segCenter(score/2,2);
    if(score<=40){const s1=score-32;return segCenter(s1>=1?s1:score-2,1)}
    if(score<=60){const s1=score-32;if(s1<=20)return segCenter(s1,1);const s2=score-40;return segCenter(Math.min(20,Math.max(1,s2)),1)}
    if(score<=100){const s1=score-40;if(s1<=20)return segCenter(s1,1);if(s1<=60&&s1%3===0)return segCenter(s1/3,3);return segCenter(20,3)}
    if(score<=170){const r=score-60;if(r===50||(r<=40&&r%2===0)||(r>50&&r<=100))return segCenter(20,3);const r2=score-57;if(r2===50||(r2<=40&&r2%2===0))return segCenter(19,3)}
    return segCenter(20,3);
  }
  if(score<=20)return segCenter(score,1);
  if(score===25)return segCenter(25,1);
  if(score===50)return segCenter(25,2);
  if(score<=40&&score%2===0)return segCenter(score/2,2);
  if(score<=60&&score%3===0)return segCenter(score/3,3);
  if(score<=40)return segCenter(score-20,1);
  if(score<=60)return segCenter(20,1);
  return segCenter(20,3);
}

/* ---------- durum ---------- */
let G=null,S=null;
let isHost=false,mq=null,roomCode="",myName="";
let net="idle",everConnected=false,session=0,homeError="";
let lastHeard=0,lastHello=0,lastPing=0,hostUpSince=0,seen=new Map();
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const topic=(code,k)=>"prodart/v1/"+code+"/"+k;
const brokerOf=code=>BROKERS[(+code[4]||1)-1]||BROKERS[0];
const dec=p=>typeof p==="string"?p:new TextDecoder().decode(p);
function mqConnect(url){return mqtt.connect(url,{clientId:"drt_"+rid(12),clean:true,keepalive:10,reconnectPeriod:2000,connectTimeout:8000})}
function pubMsg(k,m,qos){ if(mq&&mq.connected&&roomCode){try{mq.publish(topic(roomCode,k),JSON.stringify(m),{qos:qos||0})}catch(e){}} }

/* ---------- oda sahibi: oyun kuralları ---------- */
function pub(){
  const g=G;
  return{code:g.code,phase:g.phase,players:g.players,hostId:g.hostId,settings:g.settings,v:g.v||0,
    round:g.round,turn:g.turn,darts:g.darts,turnStart:g.turnStart,lastVisit:g.lastVisit,winner:g.winner,legs:g.legs};
}
function sync(){
  G.v=(G.v||0)+1;
  ls.set("host",Object.assign({},G,{saved:Date.now()}));
  pubMsg("st",{t:"state",s:pub()},1);
  apply(pub());
}
const PC={id:"pc",name:"Bilgisayar",pc:true};
const online=()=>G.players.filter(p=>p.online);
function syncPc(){
  const on=G.settings.pc, has=G.players.some(p=>p.pc);
  if(on&&!has)G.players.push(Object.assign({score:0,online:true,thrown:0,pts:0,legsWon:0},PC));
  if(!on&&has)G.players=G.players.filter(p=>!p.pc);
}
function startLeg(){
  const st=G.settings;
  for(const p of G.players){p.score=st.start;p.in=!lvl(st).dblIn;p.thrown=0;p.pts=0;p.visits=[]}
  G.phase="play"; G.darts=[]; G.lastVisit=null; G.winner=null;
  const ps=online(); G.turn=ps[(G.legs)%ps.length].id; G.turnStart=G.round=0; G.round=1; sync();
}
function nextTurn(){
  const ps=online(); if(!ps.length)return;
  const i=ps.findIndex(p=>p.id===G.turn); G.turn=ps[(i+1)%ps.length].id;
  if(i===ps.length-1)G.round++;
  G.darts=[]; G.turnStart=G.round;
}
function applyThrow(pid,x,y){
  if(!G||G.phase!=="play"||pid!==G.turn||G.darts.length>=3)return;
  x=Math.max(-300,Math.min(300,+x||0)); y=Math.max(-300,Math.min(300,+y||0));
  const p=G.players.find(q=>q.id===pid), h=hit(x,y), L=lvl(G.settings);
  const d={x,y,v:h.v,label:h.label};
  G.darts.push(d); p.thrown++;
  if(G.darts.length===1)G.visitStart=p.score;
  let v=h.v;
  if(!p.in){ if(h.m===2){p.in=true}else{v=0;d.label+=" (çift gerek)"} }
  const after=p.score-v;
  let bust=false,win=false;
  if(after<0||(L.dblOut&&after===1)||(after===0&&L.dblOut&&h.m!==2))bust=true;
  else if(after===0)win=true;
  if(bust){
    p.score=G.visitStart; d.bust=true;
    G.lastVisit={pid,pts:0,bust:true,darts:G.darts.slice()}; p.visits.push(0);
    G.pendingNext=Date.now()+1600; sync(); return;
  }
  p.score=after; p.pts+=v;
  if(win){
    p.legsWon=(p.legsWon||0)+1; G.legs++;
    G.lastVisit={pid,pts:G.visitStart-after,darts:G.darts.slice(),win:true}; p.visits.push(G.visitStart-after);
    if(G.legs>=G.settings.legs||p.legsWon>Math.floor(G.settings.legs/2)){G.phase="final";G.winner=pid;sync();return}
    G.phase="legend"; sync(); return;
  }
  if(G.darts.length===3){
    G.lastVisit={pid,pts:G.visitStart-after,darts:G.darts.slice()}; p.visits.push(G.visitStart-after);
    G.pendingNext=Date.now()+1600;
  }
  sync();
}
function hostHandle(m,pid){
  if(!G)return;
  if(m.t==="join"){
    const name=String(m.name||"Oyuncu").slice(0,20);
    let p=G.players.find(x=>x.id===pid);
    if(p){p.name=name;p.online=true}else G.players.push({id:pid,name,score:0,online:true,thrown:0,pts:0,legsWon:0,visits:[]});
    sync();
  }else if(m.t==="leave"){
    const p=G.players.find(x=>x.id===pid); if(p){p.online=false; if(G.phase==="lobby")G.players=G.players.filter(x=>x.id!==pid); if(G.phase==="play"&&G.turn===pid){nextTurn()} sync()}
  }else if(m.t==="throw"){ applyThrow(pid,m.x,m.y) }
}
let pcTimer=0;
function hostTick(now){
  if(!G)return;
  if(G.pendingNext&&now>=G.pendingNext){G.pendingNext=0; if(G.phase==="play"){nextTurn();sync()}}
  if(G.phase==="play"&&G.turn==="pc"&&!G.pendingNext&&G.darts.length<3&&now>=(pcTimer||0)){
    const p=G.players.find(q=>q.pc), L=lvl(G.settings);
    let t; if(!p.in)t=segCenter(20,2); else t=pcTarget(p.score,L);
    const s=L.sigma*(0.8+Math.random()*.4);
    applyThrow("pc",t.x+gauss()*s,t.y+gauss()*s);
    pcTimer=now+1500+Math.random()*700;
  }
  if(G.phase==="play"&&G.turn==="pc"&&G.darts.length===0&&!pcTimer)pcTimer=now+1200;
  if(G.turn!=="pc")pcTimer=0;
}
function newGame(){
  G.players=G.players.filter(p=>p.online||p.id===G.hostId||p.pc);
  for(const p of G.players){p.legsWon=0;p.thrown=0;p.pts=0;p.visits=[]}
  G.legs=0;G.phase="lobby";G.darts=[];G.lastVisit=null;G.winner=null;sync();
}
function fixSettings(st){st=Object.assign({start:501,legs:3,level:"orta",pc:true},st);if(!LEVEL[st.level])st.level="orta";if(![301,501,701].includes(st.start))st.start=501;if(![1,3,5,7].includes(st.legs))st.legs=3;return st}

/* ---------- bağlantı ---------- */
function openHost(resume,idx){
  const my=++session; isHost=true; net="connecting"; render();
  if(!resume){
    idx=idx||0;
    if(idx>=BROKERS.length){leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");return}
    G.code=G.code.slice(0,4)+(idx+1);
  }
  roomCode=G.code;
  const c=mq=mqConnect(brokerOf(G.code));
  const giveUp=setTimeout(()=>{
    if(my!==session||everConnected)return;
    try{c.end(true)}catch(e){}
    if(resume)leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");else openHost(false,idx+1);
  },8000);
  c.on("connect",()=>{
    if(my!==session)return; clearTimeout(giveUp); everConnected=true; net="ok"; hostUpSince=Date.now();
    c.subscribe(topic(G.code,"in"),{qos:1},()=>{if(my===session)sync()});
  });
  c.on("close",()=>{if(my!==session||!everConnected)return; net="re"; render()});
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session||!G)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m||typeof m.pid!=="string"||m.pid===myId)return;
    const pid=m.pid.slice(0,40); seen.set(pid,Date.now());
    const pl=G.players.find(x=>x.id===pid), back=pl&&!pl.online&&m.t!=="leave"&&m.t!=="join";
    if(back)pl.online=true;
    hostHandle(m,pid);
    if(back)sync();
  });
}
function createRoom(name){
  G={code:rid(4)+"1",phase:"lobby",hostId:myId,players:[{id:myId,name,score:0,online:true,thrown:0,pts:0,legsWon:0,visits:[]}],
     settings:fixSettings(ls.get("settings",{})),round:0,turn:null,darts:[],legs:0,lastVisit:null,winner:null,v:0};
  syncPc(); everConnected=false; openHost(false,0);
}
function hello(){lastHello=Date.now(); pubMsg("in",{t:"join",pid:myId,name:myName},1)}
function joinRoom(code,name){
  const my=++session; isHost=false; net="connecting"; roomCode=code; myName=name; everConnected=false; render();
  ls.set("last",{code,name});
  const c=mq=mqConnect(brokerOf(code));
  let upc=false;
  setTimeout(()=>{
    if(my!==session||S)return;
    leave(upc?"Oda bulunamadı. Kodu kontrol et; oda sahibinin oyun ekranı açık olmalı.":"Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");
  },12000);
  c.on("connect",()=>{
    if(my!==session)return; upc=true;
    c.subscribe(topic(code,"st"),{qos:1},()=>{if(my===session)hello()});
  });
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m)return;
    if(m.t==="closed"){leave("Oda sahibi odayı kapattı.");return}
    lastHeard=Date.now();
    if(m.t==="ping"){ if(S)pubMsg("in",{t:"pong",pid:myId}); return }
    if(m.t==="state"&&m.s&&Array.isArray(m.s.players)){
      if(!m.s.players.some(x=>x.id===myId)){ if(Date.now()-lastHello>2500)hello(); return }
      if(S&&m.s.v<S.v&&S.v-m.s.v<20)return;
      everConnected=true; apply(m.s);
    }
  });
}
function leave(msg){
  session++;
  const c=mq;
  if(c){try{
    if(c.connected&&roomCode){
      if(isHost){ if(!msg)c.publish(topic(roomCode,"st"),JSON.stringify({t:"closed"})) }
      else if(S)c.publish(topic(roomCode,"in"),JSON.stringify({t:"leave",pid:myId}));
    }
    c.end();
  }catch(e){}}
  mq=null; roomCode="";
  if(isHost&&!msg)ls.del("host");
  G=null;S=null;isHost=false;net="idle";everConnected=false;menuOpen=false;homeError=msg||"";
  if(location.search.includes("oda=")){try{history.replaceState(null,"",location.pathname+(QS.get("p")?"?p="+QS.get("p"):""))}catch(e){}}
  render();
}
function send(m){ if(isHost)hostHandle(m,myId); else pubMsg("in",Object.assign({pid:myId},m),1) }

/* ---------- 3D sahne ---------- */
/* Gerçek kamera: sağ-alt çaprazdan tahtaya bakar, böylece saplanan oklar yandan görünür. Tahta her karede
   perspektifle çizilir (poligonlar), oklar silindir+kanat olarak projekte edilir. Nişan: parmağın değdiği noktadan
   geçen ışın tahta düzlemiyle kesişir. */
const CAM={pos:{x:980,y:-620,z:260},target:{x:0,y:20,z:THROW_Z},F:1,zoom:1};
const scene={cv:null,ctx:null,W:0,H:0,cx:0,cy:0,flying:null,landed:[],aim:null,drag:null,shake:0,basis:null,power:null,swayT:0};
const v3=(x,y,z)=>({x,y,z}), sub=(a,b)=>v3(a.x-b.x,a.y-b.y,a.z-b.z), add=(a,b)=>v3(a.x+b.x,a.y+b.y,a.z+b.z), mul=(a,k)=>v3(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z, cross=(a,b)=>v3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x), len=a=>Math.hypot(a.x,a.y,a.z), norm=a=>mul(a,1/(len(a)||1));
function camBasis(){ const f=norm(sub(CAM.target,CAM.pos)), r=norm(cross(v3(0,1,0),f)), u=cross(f,r); scene.basis={f,r,u} }
function proj(p){ const B=scene.basis, d=sub(p,CAM.pos), zc=dot(d,B.f), F=CAM.F*CAM.zoom; const s=F/Math.max(1,zc); return{x:scene.cx+dot(d,B.r)*s,y:scene.cy-dot(d,B.u)*s,s,z:zc} }
function unprojectToBoard(px,py){ const B=scene.basis, F=CAM.F*CAM.zoom; const d=add(add(mul(B.r,(px-scene.cx)/F),mul(B.u,(scene.cy-py)/F)),B.f); const t=(THROW_Z-CAM.pos.z)/d.z; const p=add(CAM.pos,mul(d,t)); return{x:p.x,y:p.y} }
const onBoard=(x,y)=>v3(x,y,THROW_Z);

function drawBoard(g){

    poly(g,arcPts(R.tOut,R.dIn,a0,a1,5),dark?"#1c1c1e":"#e9dfc4");
    poly(g,arcPts(R.dIn,R.dOut,a0,a1,5),dark?"#c6342a":"#1f8a4c");

  for(let i=0;i<20;i++){const a=(i-0.5)*Math.PI/10;const p0=proj(onBoard(Math.sin(a)*R.outer,Math.cos(a)*R.outer)),p1=proj(onBoard(Math.sin(a)*R.dOut,Math.cos(a)*R.dOut));g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p1.x,p1.y);g.stroke()}

  // ışık parlaması

}
/* ok: p uç noktası (3B), dir birim yön (uçtan kuyruğa) */
function drawDart(g,p,dir,alpha){
  const B=scene.basis; let side=cross(dir,v3(0,1,0)); if(len(side)<0.15)side=B.r; side=norm(side); const upv=norm(cross(side,dir));
  const at=t=>add(p,mul(dir,t));
  const segs=[[0,42,1.6,1.6,"#d9dde6","#8a909c"],[42,112,4.2,5.4,"#3a4063","#161a2e"],[112,170,2.6,2.6,"#e3b23c","#9a7420"]];   // [t0,t1,r0,r1,açık,koyu] mm (görünürlük için büyütülmüş)
  g.globalAlpha=alpha==null?1:alpha;
  for(const [t0,t1,r0,r1,c1,c2] of segs){
    const a=at(t0),b=at(t1);
    const pts=[proj(add(a,mul(side,r0))),proj(add(b,mul(side,r1))),proj(add(b,mul(side,-r1))),proj(add(a,mul(side,-r0)))];
    const gr=g.createLinearGradient(pts[0].x,pts[0].y,pts[3].x,pts[3].y); gr.addColorStop(0,c1); gr.addColorStop(.5,c1); gr.addColorStop(1,c2);

  const fb=at(168), fe=at(215), w=26;
  const leaf=(dirv,col)=>{const pts=[proj(fb),proj(add(fe,mul(dirv,w*.2))),proj(add(fe,mul(dirv,w))),proj(add(at(188),mul(dirv,w*1.05)))];poly(g,pts,col)};
  const shade=(v)=>{const k=.75+.25*Math.max(0,dot(v,norm(v3(-.3,.8,-.5))));return k};
  leaf(upv,`rgba(227,178,60,${.95*shade(upv)})`); leaf(mul(upv,-1),`rgba(227,178,60,${.95*shade(mul(upv,-1))})`);
  leaf(side,`rgba(243,239,230,${.9*shade(side)})`); leaf(mul(side,-1),`rgba(243,239,230,${.9*shade(mul(side,-1))})`);

}
function flightPos(f,e){ // e: 0..1
  const p=add(mul(f.from,1-e),mul(f.to,e)); p.y+=Math.sin(Math.PI*e)*f.arc; return p;
}
function drawScene(now){
  const sc=scene,g=sc.ctx; if(!g)return;
  const W=sc.W,H=sc.H;
  // yumuşak zoom
  const zt=sc.drag?1.18:sc.flying?1.06:1; CAM.zoom+=(zt-CAM.zoom)*.12;
  g.clearRect(0,0,W,H);
  const shx=sc.shake>0?(Math.random()-.5)*sc.shake:0, shy=sc.shake>0?(Math.random()-.5)*sc.shake:0; sc.shake*=0.86; if(sc.shake<.3)sc.shake=0;
  g.save(); g.translate(shx,shy);
  // duvar
  const wall=g.createLinearGradient(0,0,0,H); wall.addColorStop(0,"#2a2d45"); wall.addColorStop(1,"#0c0e1c"); g.fillStyle=wall; g.fillRect(-20,-20,W+40,H+40);
  const spot=g.createRadialGradient(W*.45,H*.25,20,W*.45,H*.35,W*.9); spot.addColorStop(0,"rgba(255,226,160,.22)"); spot.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=spot; g.fillRect(0,0,W,H);
  drawBoard(g);
  // saplı oklar (uzaklığa göre sırala: önce uzaktakiler)
  const landed=sc.landed.map(d=>{const p=onBoard(d.x,d.y); const toward=norm(sub(add(CAM.pos,v3(-700,-150,0)),p)); const dir=norm(add(toward,v3(0,-0.22,0))); return{p,dir,z:proj(p).z}}).sort((a,b)=>b.z-a.z);
  for(const d of landed){ // tahtadaki gölge
    const sp=proj(onBoard(d.p.x+14,d.p.y-16)); g.fillStyle="rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(sp.x,sp.y,sp.s*22,sp.s*6,-.6,0,7); g.fill();
    drawDart(g,d.p,d.dir);
  }
  // uçan ok
  const f=sc.flying;
  if(f){
    const t=Math.min(1,(now-f.t0)/f.dur), e=1-Math.pow(1-t,1.35);            // başta hızlı, tahtaya yaklaşırken yavaş görünüm
    const p=flightPos(f,e), p2=flightPos(f,Math.min(1,e+.01)); let dir=norm(sub(p,p2));
    if(e>.55){const sp=proj(onBoard(f.to.x+14*(e-.55)*2,f.to.y-16*(e-.55)*2)); g.fillStyle=`rgba(0,0,0,${(e-.55)*.7})`; g.beginPath(); g.ellipse(sp.x,sp.y,sp.s*22,sp.s*6,-.6,0,7); g.fill()}
    // hareket izi
    for(let k=1;k<=5;k++){const q=flightPos(f,Math.max(0,e-k*.035));drawDart(g,q,dir,.22/k)}

  }

  if(sc.aim&&!f){
    const a=proj(onBoard(sc.aim.x,sc.aim.y)), r=a.s*(8+sc.aim.spread);
    g.strokeStyle="rgba(255,247,230,.95)"; g.lineWidth=1.6; g.setLineDash([5,4]); g.beginPath(); g.arc(a.x,a.y,r,0,7); g.stroke(); g.setLineDash([]);
    g.fillStyle="rgba(255,226,138,.9)"; g.beginPath(); g.arc(a.x,a.y,2.2,0,7); g.fill();
    g.beginPath(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){g.moveTo(a.x+dx*(r+3),a.y+dy*(r+3));g.lineTo(a.x+dx*(r+10),a.y+dy*(r+10))} g.stroke();

  if(sc.drag&&!f){ const B=sc.basis; drawDart(g,handPos(0.8),norm(add(add(mul(B.f,-.7),mul(B.u,-.6)),mul(B.r,.25)))) }

    const a=1-Math.max(0,(now-sc.power.t0-800)/600); const x=W-26,y0=H*.3,h=H*.4;
    g.globalAlpha=a; g.fillStyle="rgba(255,255,255,.15)"; g.fillRect(x,y0,8,h);
    g.fillStyle="rgba(120,220,150,.5)"; g.fillRect(x,y0+h*(1-.78),8,h*(.78-.42));
    g.fillStyle=sc.power.ok?"#7fe0b0":"#ff9a90"; const v=Math.min(1,sc.power.v); g.fillRect(x,y0+h*(1-v),8,h*v);
    g.globalAlpha=1;
  }

}
function toast(txt,big){

let rafId=0;
function loop(now){ drawScene(now); rafId=requestAnimationFrame(loop) }
const SWAY={basit:0,orta:4,zor:8,pro:13};        // el titremesi genliği (mm)
function mountStage(){
  const cv=document.getElementById("cv"); if(!cv||scene.cv===cv)return;
  scene.cv=cv; scene.ctx=cv.getContext("2d");
  const W=Math.min(560,cv.parentElement.clientWidth||360), H=Math.round(W*1.12), d=Math.min(2,devicePixelRatio||1);
  cv.width=W*d; cv.height=H*d; cv.style.height=H+"px"; scene.ctx.setTransform(d,0,0,d,0,0);
  scene.W=W; scene.H=H; scene.cx=W*0.5; scene.cy=H*0.47;
  camBasis(); CAM.F=(W*0.40)*len(sub(CAM.target,CAM.pos))/R.board; CAM.zoom=1;
  scene.landed=(S&&S.darts||[]).map(d=>({x:d.x,y:d.y})); scene.flying=null; scene.aim=null; scene.drag=null;
  const AIM_LIFT=55;                                     // nişangâh parmağın biraz üstünde dursun (mm)
  const aimFrom=(px,py)=>{const b=unprojectToBoard(px,py); const sw=SWAY[(S.settings||{}).level]||0, t=performance.now()/1000;
    return{x:Math.max(-260,Math.min(260,b.x+Math.sin(t*1.9)*sw)),y:Math.max(-260,Math.min(260,b.y+AIM_LIFT+Math.sin(t*2.7+1)*sw*.8))}};
  cv.onpointerdown=e=>{
    if(!canThrow())return; cv.setPointerCapture(e.pointerId);
    const r=cv.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
    const a=aimFrom(px,py); scene.aim={x:a.x,y:a.y,spread:lvl(S.settings).human};
    scene.drag={cx:px,cy:py,hist:[[px,py,performance.now(),a.x,a.y]]};
    e.preventDefault();
  };
  cv.onpointermove=e=>{
    const d=scene.drag; if(!d)return;
    const r=cv.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
    const a=aimFrom(px,py); scene.aim.x=a.x; scene.aim.y=a.y;
    d.cx=px; d.cy=py; d.hist.push([px,py,performance.now(),a.x,a.y]); if(d.hist.length>24)d.hist.shift();
  };
  cv.onpointerup=cv.onpointercancel=e=>{
    const d=scene.drag; if(!d)return; scene.drag=null;
    // Geriye doğru yürü: parmak hızlı yukarı gittiği sürece "fırlatma" hareketidir; onun başladığı nokta nişandır.
    const h=d.hist, b=h[h.length-1];
    let ai=h.length-1;
    while(ai>0){const q=h[ai-1],w=h[ai]; const dt=Math.max(1,w[2]-q[2]); const vseg=(q[1]-w[1])/dt*1000; if(vseg>300&&b[2]-q[2]<400)ai--; else break}
    if(ai>0&&h[ai-1][1]-h[ai][1]>10)ai--;                 // ilk hızlı örnek zaten yukarı sıçramışsa bir öncekini al
    const a=h[ai], vb=h[Math.min(h.length-1,ai+1)], dt=Math.max(16,b[2]-vb[2]);
    const vy=(vb[1]-b[1])/dt*1000, vx=(b[0]-vb[0])/dt*1000;
    if(vy<450||ai===h.length-1){ scene.aim=null; return }  // fırlatma yok: oku indir
    const aimPt={x:a[3],y:a[4]};
    const L=lvl(S.settings);
    const lo=1100,hi=2600, v=vy/3200;                       // güç penceresi
    let dy=0; if(vy<lo)dy=-(lo-vy)*0.06; else if(vy>hi)dy=(vy-hi)*0.04;

  :`<section class="card"><h2>Oyun ayarları</h2><p>${st.start} · ${(LEVELS.find(l=>l[0]===st.level)||LEVELS[1])[1]} · ${st.legs===1?"tek leg":"en iyi "+st.legs}${L.dblOut?" · çift çıkış":""}</p></section>
    <p class="sub center">Oda sahibinin oyunu başlatması bekleniyor…</p>`;
  return topBar()+`
  <section class="card sheet"><div class="top"><h2>Oyuncular (${S.players.length})</h2><button class="btn ghost small" data-act="menu">Davet et</button></div>${playerList()}
    <p class="sub">Kod, QR ve katılma linki üstteki oda kodunun altındaki menüde.</p></section>
  ${settings}`;
}
function scoreboard(){
  return `<div class="scores">${S.players.filter(p=>p.online||p.pc).map(p=>`<div class="score ${S.phase==="play"&&p.id===S.turn?"turn":""}"><span class="n">${esc(p.name)}${p.id===myId?" (sen)":""}${S.settings.legs>1?" · "+(p.legsWon||0)+" leg":""}</span><span class="v">${p.score}</span><span class="avg">ort. ${avg(p)}${!p.in?" · çift bekliyor":""}</span></div>`).join("")}</div>`;
}
function viewPlay(){
  const me=S.turn===myId, L=lvl(S.settings), cur=S.players.find(p=>p.id===S.turn)||{};
  const need=cur.score<=170&&L.dblOut?checkout(cur.score):"";
  return `<div id="top">`+topBar()+`</div>
  <section class="stage" id="stage">
    <canvas id="cv" width="360" height="432"></canvas>
    <div class="hud"><div><div class="who">${me?"Sıra sende":"Sıra "+esc(nameOf(S.turn))+"'de"}</div><div class="need">${need?"Çıkış: "+need:cur.in===false?"Çift ile başla":"Kalan "+cur.score}</div></div>
      <div class="darts">${[0,1,2].map(i=>`<i class="${i<S.darts.length?"used":""}"></i>`).join("")}</div></div>
    ${me&&S.darts.length<3?`<div class="hint">Tahtaya dokun: nişangâh parmağının biraz üstünde. Hızlıca yukarı fırlat.</div>`:""}
  </section>
  <div id="below">${S.lastVisit?`<div class="banner ${S.lastVisit.bust?"":""}">${esc(nameOf(S.lastVisit.pid))}: ${S.lastVisit.bust?"BUST":S.lastVisit.pts+" puan"} <span class="sub" style="color:inherit;opacity:.8">(${S.lastVisit.darts.map(d=>d.label).join(" · ")})</span></div>`:""}
  <section class="card">${scoreboard()}
    <div class="legend"><span>Leg ${S.legs+1} / ${S.settings.legs}</span><span>Tur ${S.round}</span>${L.dblOut?"<span>Çift çıkış</span>":""}${L.dblIn?"<span>Çift giriş</span>":""}</div>
  </section></div>`;
}
const CHECKOUTS={170:"T20 T20 Bull",167:"T20 T19 Bull",164:"T20 T18 Bull",161:"T20 T17 Bull",160:"T20 T20 D20",158:"T20 T20 D19",157:"T20 T19 D20",156:"T20 T20 D18",155:"T20 T19 D19",154:"T20 T18 D20",153:"T20 T19 D18",152:"T20 T20 D16",151:"T20 T17 D20",150:"T20 T18 D18",149:"T20 T19 D16",148:"T20 T16 D20",147:"T20 T17 D18",146:"T20 T18 D16",145:"T20 T15 D20",144:"T20 T20 D12",143:"T20 T17 D16",142:"T20 T14 D20",141:"T20 T19 D12",140:"T20 T20 D10",139:"T19 T14 D20",138:"T20 T18 D12",137:"T20 T19 D10",136:"T20 T20 D8",135:"Bull T15 D20",134:"T20 T14 D16",133:"T20 T19 D8",132:"Bull T14 D20",131:"T20 T13 D16",130:"T20 T20 D5",129:"T19 T16 D12",128:"T18 T14 D16",127:"T20 T17 D8",126:"T19 T19 D6",125:"Bull T17 D12",124:"T20 T16 D8",123:"T19 T16 D9",122:"T18 T18 D7",121:"T20 T11 D14",120:"T20 20 D20",119:"T19 T12 D13",118:"T20 18 D20",117:"T20 17 D20",116:"T20 16 D20",115:"T20 15 D20",114:"T20 14 D20",113:"T20 13 D20",112:"T20 12 D20",111:"T20 11 D20",110:"T20 10 D20",109:"T20 9 D20",108:"T20 16 D16",107:"T19 10 D20",106:"T20 6 D20",105:"T20 13 D16",104:"T18 18 D16",103:"T19 6 D20",102:"T20 10 D16",101:"T17 10 D20",100:"T20 D20",99:"T19 10 D16",98:"T20 D19",97:"T19 D20",96:"T20 D18",95:"T19 D19",94:"T18 D20",93:"T19 D18",92:"T20 D16",91:"T17 D20",90:"T18 D18",89:"T19 D16",88:"T16 D20",87:"T17 D18",86:"T18 D16",85:"T15 D20",84:"T20 D12",83:"T17 D16",82:"Bull D16",81:"T19 D12",80:"T20 D10",79:"T13 D20",78:"T18 D12",77:"T19 D10",76:"T20 D8",75:"T17 D12",74:"T14 D16",73:"T19 D8",72:"T16 D12",71:"T13 D16",70:"T18 D8",69:"T19 D6",68:"T20 D4",67:"T17 D8",66:"T10 D18",65:"T19 D4",64:"T16 D8",63:"T13 D12",62:"T10 D16",61:"T15 D8",60:"20 D20",59:"19 D20",58:"18 D20",57:"17 D20",56:"16 D20",55:"15 D20",54:"14 D20",53:"13 D20",52:"12 D20",51:"11 D20",50:"Bull",49:"9 D20",48:"16 D16",47:"15 D16",46:"6 D20",45:"13 D16",44:"12 D16",43:"3 D20",42:"10 D16",41:"9 D16",40:"D20",39:"7 D16",38:"D19",37:"5 D16",36:"D18",35:"3 D16",34:"D17",33:"1 D16",32:"D16",31:"15 D8",30:"D15",29:"13 D8",28:"D14",27:"11 D8",26:"D13",25:"9 D8",24:"D12",23:"7 D8",22:"D11",21:"5 D8",20:"D10",19:"3 D8",18:"D9",17:"1 D8",16:"D8",15:"7 D4",14:"D7",13:"5 D4",12:"D6",11:"3 D4",10:"D5",9:"1 D4",8:"D4",7:"3 D2",6:"D3",5:"1 D2",4:"D2",3:"1 D1",2:"D1"};
const checkout=s=>CHECKOUTS[s]||"";
function viewLegEnd(){
  const w=S.players.find(p=>p.id===(S.lastVisit||{}).pid)||{};
  return topBar()+`
  <section class="card sheet center"><div class="trophy" aria-hidden="true">🎯</div><p class="sub">Leg ${S.legs} bitti</p><h1 class="winner">${esc(w.name||"")}</h1><p class="sub">${S.lastVisit?S.lastVisit.darts.map(d=>d.label).join(" · "):""}</p></section>
  <section class="card">${scoreboard()}</section>
  ${isHost?`<button class="btn" data-act="nextleg">Sonraki leg</button>`:`<p class="sub center">Oda sahibi devam ettirecek…</p>`}`;
}
function viewFinal(){
  const board=S.players.slice().sort((a,b)=>(b.legsWon||0)-(a.legsWon||0)||a.score-b.score), top=S.players.find(p=>p.id===S.winner)||board[0];
  return topBar()+`
  <section class="card sheet center"><div class="trophy" aria-hidden="true">🏆</div><p class="sub">Maç bitti</p><h1 class="winner">${esc(top.name)}</h1><p class="sub">${S.settings.legs>1?(top.legsWon||0)+" leg kazandı":"Ortalama "+avg(top)}</p></section>
  <section class="card"><h2>Sıralama</h2>
    <table class="rank"><thead><tr><th></th><th>Oyuncu</th><th class="pts">Leg</th><th class="pts">Ort.</th></tr></thead><tbody>${board.map((p,i)=>`<tr style="--i:${i}" class="${p.id===myId?"me":""}"><td>${i+1}</td><td>${esc(p.name)}</td><td class="pts">${p.legsWon||0}</td><td class="pts">${avg(p)}</td></tr>`).join("")}</tbody></table>
  </section>
  ${isHost?`<button class="btn" data-act="again">Yeni maç</button>`:`<p class="sub center">Oda sahibi yeni maç başlatabilir.</p>`}`;
}
function render(){
  let html;
  if(!S){
    html=net==="connecting"||net==="re"
      ?`<header><h1>Pro Dart</h1></header><section class="card center"><p>Odaya bağlanılıyor…</p><button class="btn ghost" data-act="leave">Vazgeç</button></section>`
      :viewHome();
  }else if(S.phase==="lobby")html=viewLobby();
  else if(S.phase==="play")html=viewPlay();
  else if(S.phase==="legend")html=viewLegEnd();
  else html=viewFinal();
  if(html!==lastHTML){
    const act=document.activeElement, keep=act&&act.id?{id:act.id,v:act.value,s:act.selectionStart}:null;
    const vals={};for(const el of app.querySelectorAll("input[type=text]"))if(el.id)vals[el.id]=el.value;
    const screen=S?S.phase+"#"+(S.legs||0)+"#"+(S.phase==="play"?S.turn:""):"home", samePhase=app.dataset.screen===screen;
    const keepCanvas=samePhase&&S&&S.phase==="play"&&document.getElementById("cv");
    if(keepCanvas){ // sahneyi (canvas) koru, çevresindeki metinleri güncelle
      const tmp=document.createElement("div"); tmp.innerHTML=html;
      document.getElementById("top").innerHTML=tmp.querySelector("#top").innerHTML;
      document.getElementById("below").innerHTML=tmp.querySelector("#below").innerHTML;
      const st=document.getElementById("stage"), ns=tmp.querySelector("#stage");
      st.querySelectorAll(":scope > :not(canvas):not(.toast)").forEach(e=>e.remove());
      [...ns.children].filter(c=>c.tagName!=="CANVAS").forEach(c=>st.appendChild(c));
      lastHTML=html;
    }else{
      app.classList.toggle("still",samePhase); app.innerHTML=html; lastHTML=html;
      if(S&&S.phase==="play")mountStage();
    }
    app.dataset.screen=screen;
    if(samePhase)for(const id in vals){const el=document.getElementById(id);if(el)el.value=vals[id]}
    if(keep){const el=document.getElementById(keep.id);if(el&&!el.disabled){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
    if(!samePhase)window.scrollTo(0,0);
  }
  if(S&&S.phase==="play"&&scene.cv){
    // başkasının (veya bilgisayarın) attığı dartları uçur
    const n=S.darts.length;
    if(S.turn!==prevTurn||n<prevDarts){scene.landed=[];scene.flying=null;localThrowPending=false}
    if(n>prevDarts&&!(S.turn===myId&&localThrowPending===false&&scene.landed.length>=n)){
      const d=S.darts[n-1];
      if(S.turn===myId){ localThrowPending=false; if(scene.landed.length<n)scene.landed.push({x:d.x,y:d.y}) }
      else if(!scene.flying){ scene.flying=remoteFlight(d); snd("throw") }
      else scene.landed.push({x:d.x,y:d.y});
    }
    if(S.turn===myId&&prevTurn!==myId)snd("turn");
    prevDarts=n; prevTurn=S.turn;
  }else{prevDarts=0;prevTurn=null}
  if(S&&S.phase!==prevPhase){
    if(S.phase==="legend"){snd("win");if(window.FX)FX.confetti()}
    if(S.phase==="final"){snd("win");if(window.FX)FX.confetti()}
    if(S.phase==="play")snd("start");
    prevPhase=S.phase;
  }
  if(S&&S.lastVisit&&S.lastVisit.bust&&lastBustKey!==S.v&&S.darts.length){lastBustKey=S.v;snd("bad")}
}
let lastBustKey=0;
function apply(s){S=s;render()}
function tick(){
  const now=Date.now();
  if(isHost&&G)hostTick(now);
  if(isHost&&G&&mq&&mq.connected&&now-lastPing>4000){
    lastPing=now; let changed=false; pubMsg("st",{t:"ping"});
    if(now-hostUpSince>16000)for(const p of G.players){ if(p.id!==myId&&!p.pc&&p.online&&now-(seen.get(p.id)||0)>15000){p.online=false;changed=true; if(G.phase==="play"&&G.turn===p.id)nextTurn()} }
    if(changed)sync();
  }
  if(!isHost&&mq){
    if(!S){ if(mq.connected&&now-lastHello>3000)hello() }
    else{ const n=mq.connected&&now-lastHeard<13000?"ok":"re"; if(n==="re"&&mq.connected&&now-lastHello>3000)hello(); if(n!==net){net=n;render()} }
  }
}
setInterval(tick,200);

/* ---------- olaylar ---------- */
function readName(){
  const el=document.getElementById("name"), n=(el?el.value:"").trim().slice(0,20);
  if(!n){homeError="Önce adını yaz.";render();const e=document.getElementById("name");e&&e.focus();return null}
  ls.set("name",n);homeError="";return n;
}
function setSettings(){ls.set("settings",G.settings);sync()}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="create"){const n=readName();if(n)createRoom(n)}
  else if(a==="join"){
    const n=readName();if(!n)return;
    const code=(document.getElementById("code").value||"").trim().toLocaleUpperCase("en").replace(/[^A-Z0-9]/g,"");
    if(!codeOk(code)){homeError="Oda kodu 5 karakter olmalı, örneğin KTRZ1.";render();return}
    joinRoom(code,n);
  }
  else if(a==="resume"){
    const saved=ls.get("host",null);if(!saved||!codeOk(saved.code))return;
    G=saved;delete G.saved;G.settings=fixSettings(G.settings);G.players.forEach(p=>p.online=p.id===myId||p.pc);seen=new Map();everConnected=false;openHost(true);
  }
  else if(a==="leave"){menuOpen=false;leave("")}
  else if(a==="menu"){menuOpen=true;render()}
  else if(a==="menu-close"){if(ev.target.closest("[data-stop]")&&!ev.target.closest('[data-act="menu-close"].btn'))return;menuOpen=false;render()}
  else if(a==="mute"){if(window.FX){FX.setMuted(!FX.muted);if(!FX.muted)FX.sound("tap")}lastHTML="";render()}
  else if(a==="share"){
    const url=joinLink(),msg=document.getElementById("sharemsg");
    const done=t=>{if(msg){msg.textContent=t;msg.hidden=false}};
    if(navigator.share)navigator.share({title:"Pro Dart",text:"Odaya katıl: "+S.code,url}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>done("Link kopyalandı."),()=>done(url));
    else done(url);
  }
  else if(a==="copycode"){
    const msg=document.getElementById("sharemsg"),done=t=>{if(msg){msg.textContent=t;msg.hidden=false}};
    if(navigator.clipboard)navigator.clipboard.writeText(S.code).then(()=>done("Kod kopyalandı."),()=>done(S.code));else done(S.code);
  }
  else if(!isHost||!G)return;
  else if(a==="start-score"){G.settings.start=+b.dataset.v;setSettings()}
  else if(a==="level"){G.settings.level=b.dataset.level;setSettings()}
  else if(a==="pc"){G.settings.pc=b.dataset.v==="1";syncPc();setSettings()}
  else if(a==="start"){syncPc();G.legs=0;for(const p of G.players){p.legsWon=0}startLeg()}
  else if(a==="nextleg"){if(G.phase==="legend")startLeg()}
  else if(a==="again")newGame();
});
document.addEventListener("change",ev=>{ if(isHost&&G&&ev.target.id==="legs"){G.settings.legs=+ev.target.value;setSettings()} });
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="code"){ev.preventDefault();const b=document.querySelector('[data-act="join"]');b&&b.click()} });
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(b&&!b.disabled&&window.FX&&b.dataset.act!=="mute")FX.sound("tap")});
let wake=null;
async function keepAwake(){try{if(S&&"wakeLock" in navigator&&document.visibilityState==="visible"&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{keepAwake();if(document.visibilityState==="visible")tick()});
document.addEventListener("click",keepAwake);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("../sw.js").catch(()=>{});
render();
</script>
