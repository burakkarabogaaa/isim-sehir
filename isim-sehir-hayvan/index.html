<style>
/* sayfaya özel: harf kartı, süre halkası, cevap tablosu */
.letterbox{display:flex; align-items:center; gap:18px}
.letter{
  width:108px; height:108px; flex:none; border-radius:18px; perspective:600px;
  background:linear-gradient(145deg,var(--gold-2),var(--gold)); color:var(--gold-ink);
  font:700 4.6rem/108px var(--display); text-align:center; transform:rotate(-4deg);
  box-shadow:var(--glow), inset 0 -6px 0 rgba(0,0,0,.08);
  animation:flip .8s var(--spring) both;
}
@keyframes flip{0%{transform:rotate(-4deg) rotateY(90deg) scale(.7); opacity:0}60%{opacity:1}100%{transform:rotate(-4deg) rotateY(0) scale(1)}}
.ring{position:relative; width:84px; height:84px; flex:none}
.ring svg{width:84px; height:84px; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent); stroke-dasharray:226; transition:stroke-dashoffset .25s linear, stroke .3s}
.ring.low .bar{stroke:var(--bad)}
.ring .num{position:absolute; inset:0; display:grid; place-items:center; font:800 1.35rem/1 var(--body); font-variant-numeric:tabular-nums}
.ring.low .num{color:var(--bad); animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#answers input{font-weight:700}
#answers .field{animation:rise .45s var(--ease) both; animation-delay:calc(var(--i,0)*50ms)}
td.who{width:34%; font-weight:700}
tr.zero .ans{text-decoration:line-through; color:var(--soft)}
tr.zero .pts{color:var(--bad)}
tr.full .pts{color:var(--good)}
.x{min-width:40px; min-height:40px; border-radius:var(--r-s); border:1.5px solid var(--line-2); background:var(--card-solid); color:var(--ink); font-weight:800}
td.act{width:48px; text-align:right}
.winner{font-size:2.6rem; background:linear-gradient(135deg,var(--gold),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop-in .7s var(--spring) both}
.trophy{font-size:3rem; line-height:1; animation:float 3s ease-in-out infinite}
</style>
</head>
<body>

<script>
"use strict";
/* ---------- sabitler ve yardımcılar ---------- */
const LETTERS=[..."ABCÇDEFGHIİKLMNOÖPRSŞTUÜVYZ"];
const BASE_CATS=["İsim","Şehir","Hayvan","Bitki","Eşya","Ülke","Ünlü","Meslek","Yemek","Film / Dizi","Marka"];
const DEFAULT_CATS=["İsim","Şehir","Hayvan","Bitki","Eşya","Ülke"];
/* Bilgisayarın sözlüğü: kategori → harf → cevaplar. Listede olmayan harf/kategori için bilgisayar boş bırakır. */
const PC_WORDS={
 "isim":{A:["Ali","Ayşe","Ahmet"],B:["Burak","Berna","Barış"],C:["Can","Cem","Ceren"],Ç:["Çağla","Çetin"],D:["Deniz","Derya","Doğan"],E:["Elif","Emre","Ece"],F:["Fatma","Fırat"],G:["Gizem","Gökhan"],H:["Hasan","Hülya"],I:["Işık","Irmak"],İ:["İrem","İsmail"],K:["Kerem","Kaan"],L:["Leyla","Levent"],M:["Mehmet","Merve"],N:["Nazlı","Nihat"],O:["Onur","Okan"],Ö:["Özge","Ömer"],P:["Pınar","Pelin"],R:["Rana","Rıza"],S:["Selin","Serkan"],Ş:["Şeyma","Şahin"],T:["Tolga","Tuğçe"],U:["Umut","Ufuk"],Ü:["Ümit","Ülkü"],V:["Volkan","Veli"],Y:["Yasemin","Yusuf"],Z:["Zeynep","Zafer"]},
 "şehir":{A:["Ankara","Antalya","Adana"],B:["Bursa","Berlin","Bodrum"],C:["Cenevre","Cezayir"],Ç:["Çanakkale","Çorum"],D:["Denizli","Diyarbakır"],E:["Edirne","Erzurum","Eskişehir"],F:["Fethiye","Floransa"],G:["Girne","Gazimağusa","Gaziantep"],H:["Hatay","Hamburg"],I:["Isparta","Iğdır"],İ:["İstanbul","İzmir","İskele"],K:["Konya","Kayseri","Kahire"],L:["Lefkoşa","Londra","Lizbon"],M:["Mersin","Madrid","Muğla"],N:["Niğde","Nevşehir","Napoli"],O:["Ordu","Oslo"],Ö:["Ödemiş"],P:["Paris","Prag"],R:["Rize","Roma"],S:["Samsun","Sivas","Sidney"],Ş:["Şanlıurfa","Şırnak"],T:["Trabzon","Tokyo","Tekirdağ"],U:["Uşak","Urla"],Ü:["Ürgüp","Ünye"],V:["Van","Viyana","Venedik"],Y:["Yalova","Yozgat"],Z:["Zonguldak","Zürih"]},
 "hayvan":{A:["Aslan","Ayı","At"],B:["Balina","Baykuş","Balık"],C:["Ceylan","Civciv"],Ç:["Çita","Çakal"],D:["Deve","Domuz","Deniz atı"],E:["Eşek","Ejder balığı"],F:["Fil","Fare","Flamingo"],G:["Geyik","Gergedan"],H:["Horoz","Hamsi","Hindi"],I:["Istakoz"],İ:["İnek","İguana"],K:["Kedi","Köpek","Kartal"],L:["Leylek","Leopar"],M:["Maymun","Martı"],N:["Nil timsahı"],O:["Orangutan","Okapi"],Ö:["Örümcek","Ördek"],P:["Panda","Papağan","Penguen"],R:["Rakun","Ren geyiği"],S:["Sincap","Serçe","Salyangoz"],Ş:["Şahin","Şempanze"],T:["Tavşan","Timsah","Tilki"],U:["Uğur böceği"],Ü:["Üveyik"],V:["Vaşak","Vatoz"],Y:["Yılan","Yunus"],Z:["Zürafa","Zebra"]},
 "bitki":{A:["Ayçiçeği","Akasya","Ardıç"],B:["Begonya","Buğday","Biber"],C:["Ceviz","Camgüzeli"],Ç:["Çam","Çınar","Çilek"],D:["Defne","Domates"],E:["Elma","Erik","Eğrelti"],F:["Fesleğen","Fındık"],G:["Gül","Gelincik"],H:["Hanımeli","Havuç"],I:["Ihlamur","Ispanak"],İ:["İncir","İğde"],K:["Kaktüs","Kavak","Karanfil"],L:["Lale","Lavanta","Limon"],M:["Menekşe","Meşe","Mısır"],N:["Nane","Nergis","Nar"],O:["Orkide","Okaliptüs"],Ö:["Öksürük otu"],P:["Papatya","Palmiye","Patates"],R:["Reyhan","Roka"],S:["Sarımsak","Söğüt","Sümbül"],Ş:["Şeftali","Şimşir"],T:["Tere","Turp"],U:["Unutmabeni"],Ü:["Üzüm"],V:["Vişne"],Y:["Yonca","Yasemin"],Z:["Zeytin","Zambak","Zencefil"]},
 "eşya":{A:["Ayna","Anahtar","Ayakkabı"],B:["Bardak","Bavul","Battaniye"],C:["Cüzdan","Cetvel"],Ç:["Çanta","Çatal","Çekiç"],D:["Dolap","Defter"],E:["Elbise","Eldiven"],F:["Fırça","Fincan","Fener"],G:["Gözlük","Gömlek"],I:["Islık","Izgara"],İ:["İğne","İp"],H:["Halı","Havlu"],K:["Kalem","Kaşık","Koltuk"],L:["Lamba","Leğen"],M:["Masa","Makas","Mum"],N:["Nevresim"],O:["Oyuncak","Ocak"],Ö:["Örtü","Önlük"],P:["Perde","Pantolon"],R:["Radyo","Raf"],S:["Sandalye","Saat","Sepet"],Ş:["Şemsiye","Şapka"],T:["Tabak","Telefon","Tarak"],U:["Uçurtma","Ustura"],Ü:["Ütü"],V:["Vazo","Valiz"],Y:["Yastık","Yorgan"],Z:["Zil","Zımba"]},
 "ülke":{A:["Almanya","Avustralya","Arjantin"],B:["Brezilya","Belçika","Bulgaristan"],C:["Cezayir","Cibuti"],Ç:["Çin","Çekya"],D:["Danimarka"],E:["Endonezya","Ekvador"],F:["Fransa","Finlandiya","Fas"],G:["Güney Kore","Gürcistan","Gana"],H:["Hindistan","Hollanda","Hırvatistan"],I:["Irak","Iran"],İ:["İtalya","İspanya","İsveç"],K:["Kanada","Kolombiya","Küba"],L:["Lübnan","Letonya"],M:["Meksika","Mısır","Malezya"],N:["Norveç","Nijerya"],O:["Orta Afrika Cumhuriyeti"],Ö:["Özbekistan"],P:["Portekiz","Polonya","Peru"],R:["Rusya","Romanya"],S:["Suriye","Sırbistan"],Ş:["Şili"],T:["Türkiye","Tunus","Tayland"],U:["Ukrayna","Uruguay"],Ü:["Ürdün"],V:["Vietnam","Venezuela"],Y:["Yunanistan","Yemen","Yeni Zelanda"],Z:["Zambiya","Zimbabve"]},
 "meslek":{A:["Avukat","Aşçı","Asker"],B:["Berber","Boyacı"],C:["Cerrah","Cam ustası"],Ç:["Çiftçi","Çevirmen"],D:["Doktor","Diş hekimi"],E:["Eczacı","Elektrikçi"],F:["Fırıncı","Fotoğrafçı"],G:["Garson","Gazeteci"],H:["Hemşire","Hakim"],I:["Işık tasarımcısı"],İ:["İtfaiyeci","İnşaat mühendisi"],K:["Kasap","Kuaför","Kaptan"],L:["Lokantacı"],M:["Mimar","Marangoz","Muhasebeci"],N:["Noter"],O:["Oyuncu","Operatör"],Ö:["Öğretmen"],P:["Pilot","Polis","Psikolog"],R:["Ressam","Rehber"],S:["Sürücü","Savcı","Sunucu"],Ş:["Şoför","Şarkıcı"],T:["Terzi","Tesisatçı"],U:["Uçak mühendisi"],Ü:["Ürolog"],V:["Veteriner"],Y:["Yazar","Yönetmen"],Z:["Ziraat mühendisi"]},
 "yemek":{A:["Ayran","Aşure"],B:["Baklava","Börek","Bulgur pilavı"],C:["Cacık"],Ç:["Çorba","Çiğ köfte"],D:["Dolma","Döner"],E:["Et sote","Ekmek kadayıfı"],F:["Fasulye","Fırın sütlaç"],G:["Gözleme","Güllaç"],H:["Hellim","Hamsi tava","Hünkar beğendi"],I:["Ispanak yemeği","Izgara köfte"],İ:["İskender","İmam bayıldı"],K:["Köfte","Kebap","Künefe"],L:["Lahmacun","Lokma"],M:["Mantı","Mercimek çorbası","Molehiya"],N:["Nohut"],O:["Omlet"],Ö:["Örgü peyniri"],P:["Pide","Pilav","Pilavuna"],R:["Revani","Ravioli"],S:["Sarma","Sütlaç","Simit"],Ş:["Şeftali kebabı","Şekerpare"],T:["Tavuk şiş","Tarhana"],U:["Un helvası"],Ü:["Üzüm hoşafı"],V:["Vişne reçeli"],Y:["Yaprak sarma","Yoğurt"],Z:["Zeytinyağlı fasulye","Zerde"]},
 "marka":{A:["Apple","Adidas","Arçelik"],B:["BMW","Beko","Bosch"],C:["Canon","Coca-Cola"],Ç:["Çaykur"],D:["Dell","Dove"],E:["Eti","Efes"],F:["Ford","Fiat","Ferrari"],G:["Google","Gucci"],H:["Honda","Huawei"],I:["IKEA"],İ:["İş Bankası"],K:["Koton","Kia"],L:["Lego","LC Waikiki","Lenovo"],M:["Mercedes","Mavi","Migros"],N:["Nike","Nestlé","Nokia"],O:["Opel","Oreo"],P:["Pepsi","Puma","Philips"],R:["Renault","Rolex"],S:["Samsung","Sony","Starbucks"],Ş:["Şölen","Şok"],T:["Toyota","Tesla","Turkcell"],U:["Uno","Under Armour"],Ü:["Ülker"],V:["Vodafone","Volvo","Vestel"],Y:["Yapı Kredi","Yamaha"],Z:["Zara","Zorlu"]}
};
const PC={id:"pc",name:"Bilgisayar",pc:true};
function fixSettings(st){st=Object.assign({pc:"off"},st);if(!["off","basit","orta","zor","pro"].includes(st.pc))st.pc=st.pc==="kolay"?"basit":"orta";return st}
const PC_RATE={basit:0.45,orta:0.7,zor:0.9,pro:1};
const PC_STOP={basit:[0.9,1.2],orta:[0.65,0.9],zor:[0.45,0.65],pro:[0.3,0.45]};
const LEVELS=[["off","Yok"],["basit","Basit"],["orta","Orta"],["zor","Zor"],["pro","Pro"]];
function pcPlan(letter,cats,level){
  const a={}, L=norm(letter);
  for(const c of cats){
    const d=PC_WORDS[norm(c)]; const list=d&&(d[letter]||d[L.toLocaleUpperCase("tr")])||[];
    a[c]=list.length&&Math.random()<PC_RATE[level]?list[Math.floor(Math.random()*list.length)]:"";
  }
  return a;
}
const QS=new URLSearchParams(location.search);
const NS="ish"+(QS.get("p")?"-"+QS.get("p"):"")+"-";   // ?p=2 : aynı cihazda ikinci oyuncu denemek için
const ls={
  get(k,d){try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(NS+k)}catch(e){}}
};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").trim().toLocaleLowerCase("tr").replace(/\s+/g," ");
const rid=n=>{let s="";const a="ABCDEFGHJKLMNPRSTUVYZ23456789";for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
let myId=ls.get("pid");
if(!myId){myId="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);ls.set("pid",myId)}

/* ---------- puanlama (saf fonksiyon) ----------
   Boş ya da yanlış harfle başlayan: 0. Başkasıyla aynı cevap: 5. Benzersiz cevap: 10. */
function scoreRound(s){
  const cells={},per={},L=norm(s.letter);
  for(const p of s.players){cells[p.id]={};per[p.id]=0}
  for(const cat of s.settings.cats){
    const count={};
    for(const p of s.players){
      const raw=((s.answers||{})[p.id]||{})[cat]||"",n=norm(raw);
      let why="";
      if(!n)why="boş";
      else if(!n.startsWith(L))why="harf";
      else if((s.invalid||{})[p.id+"|"+cat])why="geçersiz";
      cells[p.id][cat]={raw:raw.trim(),n,why,pts:0};
      if(!why)count[n]=(count[n]||0)+1;
    }
    for(const p of s.players){
      const c=cells[p.id][cat];
      if(!c.why){c.pts=count[c.n]>1?5:10;per[p.id]+=c.pts}
    }
  }
  return {cells,per};
}

/* ---------- durum ---------- */
let G=null;            // oda sahibindeki asıl oyun durumu
let S=null;            // herkesin gördüğü durum
let isHost=false, mq=null, roomCode="", myName="";
let net="idle";        // idle | connecting | ok | re
let everConnected=false, session=0, homeError="";
let draft={}, draftKey="", deadlineLocal=0, sentStop=false;
let lastHeard=0, lastHello=0, lastPing=0, hostUpSince=0, seen=new Map();

/* Bağlantı: telefonlar birbirine doğrudan değil, herkese açık bir mesaj sunucusu (MQTT) üzerinden konuşur.
   Oda kodunun son rakamı hangi sunucunun kullanıldığını söyler. */
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const topic=(code,k)=>"isimsehirhayvan/v2/"+code+"/"+k;
const brokerOf=code=>BROKERS[(+code[4]||1)-1]||BROKERS[0];
const dec=p=>typeof p==="string"?p:new TextDecoder().decode(p);
function mqConnect(url){return mqtt.connect(url,{clientId:"ish_"+rid(12),clean:true,keepalive:10,reconnectPeriod:2000,connectTimeout:8000})}
function pubMsg(k,m,qos){ if(mq&&mq.connected&&roomCode){try{mq.publish(topic(roomCode,k),JSON.stringify(m),{qos:qos||0})}catch(e){}} }

/* ---------- oda sahibi ---------- */
function pub(){
  const g=G,s={code:g.code,phase:g.phase,players:g.players,hostId:g.hostId,settings:g.settings,
    round:g.round,letter:g.letter,stopper:g.stopper,v:g.v||0,
    remaining:g.phase==="play"?Math.max(0,g.deadline-Date.now()):0};
  if(g.phase==="review"||g.phase==="final"){s.answers=g.answers;s.invalid=g.invalid}
  return s;
}
function sync(){
  G.v=(G.v||0)+1;
  ls.set("host",Object.assign({},G,{saved:Date.now()}));
  const s=pub();
  pubMsg("st",{t:"state",s},1);
  apply(s);
}
function hostHandle(m,pid){
  if(!G)return;
  if(m.t==="join"){
    const name=String(m.name||"Oyuncu").slice(0,20);
    let p=G.players.find(x=>x.id===pid);
    if(p){p.name=name;p.online=true}else G.players.push({id:pid,name,score:0,online:true});
    sync();
  }else if(m.t==="draft"){
    if((G.phase==="play"||G.phase==="collect")&&m.round===G.round&&m.answers&&typeof m.answers==="object"){
      const a={};for(const c of G.settings.cats)a[c]=String(m.answers[c]||"").slice(0,40);
      G.answers[pid]=a; ls.set("host",Object.assign({},G,{saved:Date.now()}));
    }
  }else if(m.t==="stop"){
    if(G.phase==="play"&&m.round===G.round){G.stopper=pid;endRound()}
  }else if(m.t==="leave"){
    const p=G.players.find(x=>x.id===pid); if(p){p.online=false; if(G.phase==="lobby")G.players=G.players.filter(x=>x.id!==pid); sync()}
  }
}
function startRound(){
  if(!G.settings.cats.length)return;
  let pool=LETTERS.filter(l=>!G.used.includes(l)); if(!pool.length){G.used=[];pool=LETTERS}
  G.letter=pool[Math.floor(Math.random()*pool.length)]; G.used.push(G.letter);
  G.round++; G.answers={}; G.invalid={}; G.stopper=null; G.phase="play";
  G.deadline=Date.now()+G.settings.secs*1000;
  if(G.settings.pc!=="off"){
    const a=pcPlan(G.letter,G.settings.cats,G.settings.pc); G.answers.pc=a;
    const full=G.settings.cats.every(c=>a[c]);
    const f=PC_STOP[G.settings.pc]||PC_STOP.orta;
    G.pcStopAt=full?Date.now()+G.settings.secs*1000*(f[0]+Math.random()*(f[1]-f[0])):0;
  }else G.pcStopAt=0;
  sync();
}
function endRound(){
  if(!G||G.phase!=="play")return;
  G.phase="collect"; G.collectAt=Date.now(); sync();   // herkes son cevaplarını yollar
}
function commitRound(){
  const sc=scoreRound(pub());
  for(const p of G.players)p.score+=sc.per[p.id]||0;
  if(G.round>=G.settings.rounds){G.phase="final";sync()}else startRound();
}
function newGame(){
  for(const p of G.players)p.score=0;
  G.players=G.players.filter(p=>p.online||p.id===G.hostId||p.pc);
  G.round=0;G.used=[];G.answers={};G.invalid={};G.letter="";G.phase="lobby";sync();
}
function openHost(resume,idx){
  const my=++session; isHost=true; net="connecting"; render();
  if(!resume){
    idx=idx||0;
    if(idx>=BROKERS.length){leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");return}
    G.code=G.code.slice(0,4)+(idx+1);
  }
  roomCode=G.code;
  const c=mq=mqConnect(brokerOf(G.code));
  const giveUp=setTimeout(()=>{
    if(my!==session||everConnected)return;
    try{c.end(true)}catch(e){}
    if(resume)leave("Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");else openHost(false,idx+1);
  },8000);
  c.on("connect",()=>{
    if(my!==session)return; clearTimeout(giveUp); everConnected=true; net="ok"; hostUpSince=Date.now();
    c.subscribe(topic(G.code,"in"),{qos:1},()=>{if(my===session)sync()});
  });
  c.on("close",()=>{if(my!==session||!everConnected)return; net="re"; render()});
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session||!G)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m||typeof m.pid!=="string"||m.pid===myId)return;
    const pid=m.pid.slice(0,40); seen.set(pid,Date.now());
    const pl=G.players.find(x=>x.id===pid), back=pl&&!pl.online&&m.t!=="leave"&&m.t!=="join";
    if(back)pl.online=true;
    hostHandle(m,pid);
    if(back)sync();
  });
}
function createRoom(name){
  G={code:rid(4)+"1",phase:"lobby",hostId:myId,players:[{id:myId,name,score:0,online:true}],
     settings:fixSettings(ls.get("settings",{cats:DEFAULT_CATS.slice(),secs:90,rounds:5})),
     round:0,letter:"",used:[],answers:{},invalid:{},stopper:null,deadline:0,v:0};
  everConnected=false; openHost(false,0);
}

/* ---------- oyuncu ---------- */
function hello(){lastHello=Date.now(); pubMsg("in",{t:"join",pid:myId,name:myName},1)}
function joinRoom(code,name){
  const my=++session; isHost=false; net="connecting"; roomCode=code; myName=name; everConnected=false; render();
  ls.set("last",{code,name});
  const c=mq=mqConnect(brokerOf(code));
  let up=false;
  setTimeout(()=>{
    if(my!==session||S)return;
    leave(up?"Oda bulunamadı. Kodu kontrol et; oda sahibinin oyun ekranı açık olmalı.":"Oyun sunucusuna bağlanılamadı. İnternetini kontrol edip tekrar dene.");
  },12000);
  c.on("connect",()=>{
    if(my!==session)return; up=true;
    c.subscribe(topic(code,"st"),{qos:1},()=>{if(my===session){hello(); if(S)sendDraft()}});
  });
  c.on("error",()=>{});
  c.on("message",(t,p)=>{
    if(my!==session)return;
    let m; try{m=JSON.parse(dec(p))}catch(e){return}
    if(!m)return;
    if(m.t==="closed"){leave("Oda sahibi odayı kapattı.");return}
    lastHeard=Date.now();
    if(m.t==="ping"){ if(S)pubMsg("in",{t:"pong",pid:myId}); return }
    if(m.t==="state"&&m.s&&Array.isArray(m.s.players)){
      if(!m.s.players.some(x=>x.id===myId)){ if(Date.now()-lastHello>2500)hello(); return }
      if(S&&m.s.v<S.v&&S.v-m.s.v<20)return;       // geciken eski mesaj
      everConnected=true; apply(m.s);
    }
  });
}
function leave(msg){
  session++;

  if(c){try{
    if(c.connected&&roomCode){
      if(isHost){ if(!msg)c.publish(topic(roomCode,"st"),JSON.stringify({t:"closed"})) }
      else if(S)c.publish(topic(roomCode,"in"),JSON.stringify({t:"leave",pid:myId}));
    }
    c.end();
  }catch(e){}}
  mq=null; roomCode="";
  if(isHost&&!msg)ls.del("host");
  G=null;S=null;isHost=false;net="idle";everConnected=false;menuOpen=false;homeError=msg||"";
  if(location.search.includes("oda=")){try{history.replaceState(null,"",location.pathname+(QS.get("p")?"?p="+QS.get("p"):""))}catch(e){}}
  render();
}
function send(m){

function sendDraft(){ if(S&&(S.phase==="play"||S.phase==="collect"))send({t:"draft",round:S.round,answers:draft}) }
let draftTimer=0;
function queueDraft(){ ls.set("draft",{key:draftKey,draft}); clearTimeout(draftTimer); draftTimer=setTimeout(sendDraft,500) }

function apply(s){
  const prevPhase=S&&S.phase, prevRound=S&&S.round;
  S=s; deadlineLocal=Date.now()+(s.remaining||0);
  const key=s.code+"#"+s.round;
  if(key!==draftKey){

    const saved=ls.get("draft",null); draft=saved&&saved.key===key?saved.draft:{};
  }
  if(s.phase==="collect"&&(prevPhase!=="collect"||prevRound!==s.round)){clearTimeout(draftTimer);sendDraft()}
  render();
}

function render(){

      ?`<header><h1>İsim Şehir Hayvan</h1></header><section class="card center"><p>Odaya bağlanılıyor…</p><button class="btn ghost" data-act="leave">Vazgeç</button></section>`
      :viewHome();
  }else if(S.phase==="lobby")html=viewLobby();
  else if(S.phase==="play"||S.phase==="collect")html=viewPlay();
  else if(S.phase==="review")html=viewReview();
  else html=viewFinal();
  if(html!==lastHTML){
    // yazı yazılan alanları koru: aynı ekranda odak ve değerleri geri yükle
    const act=document.activeElement, keep=act&&act.id?{id:act.id,v:act.value,s:act.selectionStart}:null;
    const vals={};for(const el of app.querySelectorAll("input[type=text]"))if(el.id)vals[el.id]=el.value;
    const samePhase=app.dataset.screen===(S?S.phase+"#"+S.round:"home");
    app.classList.toggle("still",samePhase); app.innerHTML=html; lastHTML=html; app.dataset.screen=S?S.phase+"#"+S.round:"home";
    if(S&&(S.phase==="play"||S.phase==="collect")){
      for(const el of app.querySelectorAll("#answers input"))el.value=draft[el.dataset.cat]||"";
    }else if(samePhase){
      for(const id in vals){const el=document.getElementById(id);if(el&&!el.dataset.cat)el.value=vals[id]}
    }
    if(keep){const el=document.getElementById(keep.id);if(el&&!el.disabled){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
    if(!samePhase){window.scrollTo(0,0); if(S&&S.phase==="final"&&window.FX)FX.confetti()}
  }
  tick();
}
function tick(){
  const now=Date.now();
  if(isHost&&G&&mq&&mq.connected&&now-lastPing>4000){
    lastPing=now; let changed=false;
    pubMsg("st",{t:"ping"});
    if(now-hostUpSince>16000)for(const p of G.players){
      if(p.id!==myId&&!p.pc&&p.online&&now-(seen.get(p.id)||0)>15000){p.online=false;changed=true}
    }
    if(changed)sync();
  }
  if(!isHost&&mq){
    if(!S){ if(mq.connected&&now-lastHello>3000)hello() }
    else{
      const n=mq.connected&&now-lastHeard<13000?"ok":"re";
      if(n==="re"&&mq.connected&&now-lastHello>3000)hello();
      if(n!==net){net=n;render();return}
    }
  }
  if(isHost&&G){
    if(G.phase==="play"&&G.pcStopAt&&Date.now()>=G.pcStopAt){G.stopper="pc";endRound()}
    else if(G.phase==="play"&&Date.now()>=G.deadline)endRound();
    else if(G.phase==="collect"&&Date.now()-G.collectAt>=1500){G.phase="review";sync()}
  }
  if(!S||S.phase!=="play"&&S.phase!=="collect")return;
  const t=document.getElementById("timer");
  if(t){
    const left=S.phase==="collect"?0:Math.max(0,Math.ceil((deadlineLocal-Date.now())/1000));
    const txt=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(t.textContent!==txt)t.textContent=txt;
    const ring=document.getElementById("ring"),bar=document.getElementById("bar");
    if(ring)ring.classList.toggle("low",left<=10&&S.phase==="play");
    if(bar){const total=S.settings.secs*1000,rem=S.phase==="collect"?0:Math.max(0,deadlineLocal-Date.now());bar.style.strokeDashoffset=(226*(1-rem/total)).toFixed(1)}
  }
  const b=document.getElementById("stopbtn");
  if(b)b.disabled=sentStop||!S.settings.cats.every(c=>norm(draft[c]));
}

    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>done("Link kopyalandı."),()=>done(url));

  if(el.id==="newcat"){ev.preventDefault();const b=document.querySelector('[data-act="addcat"]');b&&b.click()}
  else if(el.id==="code"){ev.preventDefault();const b=document.querySelector('[data-act="join"]');b&&b.click()}
  else if(el.dataset&&el.dataset.cat){ev.preventDefault();const all=[...document.querySelectorAll("#answers input")],n=all[all.indexOf(el)+1];if(n)n.focus();else el.blur()}
});
/* ekran kapanırsa bağlantı kopar: oyun sırasında ekranı açık tut */
let wake=null;
async function keepAwake(){try{if(S&&"wakeLock" in navigator&&document.visibilityState==="visible"&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{keepAwake();if(document.visibilityState==="visible"){tick();if(!isHost&&S)sendDraft()}});
document.addEventListener("click",keepAwake);
window.addEventListener("pagehide",()=>{if(!isHost&&S)sendDraft()});

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("../sw.js").catch(()=>{});
render();
</script>
